<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f1115;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
}
#display { width: 100vw; height: 100vh; }
#display canvas { display: block; }

#status {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  color: #e6edf3;
  background: rgba(22, 27, 34, 0.85);
  border: 1px solid rgba(240, 246, 252, 0.1);
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.3px;
  z-index: 10;
  backdrop-filter: blur(8px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  transition: all 0.3s ease;
}
#status.connected { color: #3fb950; border-color: rgba(63, 185, 80, 0.3); }
#status.closed { color: #f85149; border-color: rgba(248, 81, 73, 0.3); }
#status.error { color: #d29922; border-color: rgba(210, 153, 34, 0.3); }

/* Guacamole overlay elements styling */
.guac-overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(22, 27, 34, 0.95);
  border: 1px solid rgba(240, 246, 252, 0.15);
  border-radius: 8px;
  padding: 24px;
  color: #e6edf3;
  font-family: inherit;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  max-width: 480px;
  z-index: 20;
}
</style>
</head>
<body>
<div id="display"></div>
<div id="status">connecting...</div>
<script>
// Silently log errors to console instead of overwriting status
window.onerror = function(msg, url, line) {
  console.error('remote.html error:', msg, url, line);
  return true; // prevent default
};
</script>
<script type="module">
import Guacamole from '/guacamole/guacamole-common.min.js';

const statusEl = document.getElementById('status');
const params = new URLSearchParams(location.search);
const hostId = params.get('hostId');
const protocol = params.get('protocol') || 'ssh';
const identityId = params.get('identityId') || '';
const targetPort = params.get('targetPort') || '';

const wsProto = location.protocol === 'https:' ? 'wss://' : 'ws://';
const wsUrl = wsProto + 'localhost:8081' + '/ws/ms/server/terminal?hostId=' + hostId +
  '&protocol=' + protocol +
  (identityId ? '&identityId=' + identityId : '') +
  (targetPort ? '&targetPort=' + targetPort : '') + '&_gc=';

const tunnel = new Guacamole.WebSocketTunnel(wsUrl);
const client = new Guacamole.Client(tunnel);
const displayEl = client.getDisplay().getElement();
displayEl.style.width = '100%';
displayEl.style.height = '100%';
document.getElementById('display').appendChild(displayEl);
client.connect('');

const keyboard = new Guacamole.Keyboard(document);
keyboard.onkeydown = (keysym) => client.sendKeyEvent(1, keysym);
keyboard.onkeyup = (keysym) => client.sendKeyEvent(0, keysym);
const mouse = new Guacamole.Mouse(displayEl);
mouse.onmousedown = (e) => { if (e && e.state) client.sendMouseState(e.state, true); };
mouse.onmouseup = (e) => { if (e && e.state) client.sendMouseState(e.state, true); };
mouse.onmousemove = (e) => { if (e && e.state) client.sendMouseState(e.state, false); };
mouse.onmousewheel = (e) => { if (e) client.sendMouseState(e.deltaY > 0 ? -1 : 1, true); };

function doResize() {
  const w = window.innerWidth || document.body.clientWidth || 800;
  const h = window.innerHeight || document.body.clientHeight || 600;
  client.sendSize(w, h);
}
window.addEventListener('resize', doResize);
requestAnimationFrame(() => { doResize(); setTimeout(doResize, 100); setTimeout(doResize, 300); setTimeout(doResize, 800); });

// Keepalive ping every 30s to prevent long connection timeout
let keepaliveTimer = null;
tunnel.onstatechange = (state) => {
  if (state === Guacamole.Tunnel.State.OPEN) {
    statusEl.textContent = '● 已连接';
    statusEl.className = 'connected';
    setTimeout(doResize, 50);
    // Start keepalive
    if (keepaliveTimer) clearInterval(keepaliveTimer);
    keepaliveTimer = setInterval(() => {
      try {
        // Send a harmless sync message to keep the connection alive
        client.sendSync();
      } catch(e) {}
    }, 30000);
  }
  else if (state === Guacamole.Tunnel.State.CLOSED) {
    statusEl.textContent = '○ 已断开';
    statusEl.className = 'closed';
    if (keepaliveTimer) clearInterval(keepaliveTimer);
  }
};
tunnel.onerror = (status) => {
  statusEl.textContent = '⚠ 连接失败: ' + (status && status.message ? status.message : '未知错误');
  statusEl.className = 'error';
  if (keepaliveTimer) clearInterval(keepaliveTimer);
};

// Handle page visibility - reconnect if needed
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    // When tab becomes visible again, check connection state
    setTimeout(doResize, 100);
  }
});
</script>
</body>
</html>
