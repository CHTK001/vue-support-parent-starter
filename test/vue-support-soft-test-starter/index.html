<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <title>Soft 测试台</title>
    <meta name="sys-app-code" content="soft-test" />
    <link rel="icon" href="/favicon.ico" />
    <script>
      window.__SYS_APP_CODE__ = "soft-test";
      document.documentElement.setAttribute("data-system-code", "soft-test");
      try {
        var storage = localStorage.getItem("responsive-layout");
        if (storage) {
          var layoutConfig = JSON.parse(storage);
          if (layoutConfig.darkMode) {
            document.documentElement.classList.add("dark");
          }
        } else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <script src="/loader-config.js"></script>
    <script src="/loader.js"></script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
