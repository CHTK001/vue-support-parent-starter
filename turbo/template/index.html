<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon 双保险：下面的静态 link（data URI 内置 logo，不依赖任何 public 资源）
         保证 HTML 一到浏览器标签页就有图标——此前壳里没有任何 favicon link，浏览器启动
         / 整页刷新（含点击菜单懒加载触发 Vite 依赖重优化后的 reload）窗口内回退请求
         /favicon.ico，多数应用 public 无此文件 → 404 → 标签页图标消失。
         JS 就绪后 koi 守卫 setDocumentFavicon() 仍按 getConfig().login.logoUrl 覆盖此值。 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20128%20128'%20fill='none'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0%25'%20y1='0%25'%20x2='100%25'%20y2='100%25'%3E%3Cstop%20offset='0%25'%20stop-color='%234A9BD9'/%3E%3Cstop%20offset='100%25'%20stop-color='%235AC8A0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx='64'%20cy='64'%20r='56'%20fill='url(%23g)'/%3E%3Cpath%20d='M40%2052%20L56%2044%20L72%2052%20L72%2068%20L56%2076%20L40%2068%20Z'%20fill='white'%20opacity='0.95'/%3E%3Cpath%20d='M56%2060%20L72%2052%20L88%2060%20L88%2076%20L72%2084%20L56%2076%20Z'%20fill='white'%20opacity='0.7'/%3E%3Ccircle%20cx='64'%20cy='64'%20r='6'%20fill='white'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%APP_TITLE%</title>
  </head>
  <body>
    <!-- 全屏加载动画：防止白屏，应用挂载完成后由 createApp 调用 window.hideAppLoader() 隐藏 -->
    <script src="/loader-config.js"></script>
    <script src="/loader.js"></script>
    <div id="app"></div>
    <!-- rAF 兜底：原生 rAF 优先（可见页与刷新同步、体验不变）；页面隐藏 / 后台标签
         原生 rAF 不触发时，由 setTimeout 16ms 兜底，保证后台标签也能实时渲染与推送 -->
    <script>
      (function () {
        var nRaf = window.requestAnimationFrame
          ? window.requestAnimationFrame.bind(window)
          : null;
        var nCancel = window.cancelAnimationFrame
          ? window.cancelAnimationFrame.bind(window)
          : null;
        window.requestAnimationFrame = function (cb) {
          var fired = false;
          var nativeId = null;
          var timer = setTimeout(function () {
            if (fired) return;
            fired = true;
            cb(performance.now());
          }, 16);
          if (nRaf) {
            nativeId = nRaf(function () {
              if (fired) return;
              fired = true;
              clearTimeout(timer);
              cb(performance.now());
            });
          }
          return { timer: timer, nativeId: nativeId };
        };
        window.cancelAnimationFrame = function (handle) {
          if (!handle) return;
          clearTimeout(handle.timer);
          if (nCancel && handle.nativeId != null) nCancel(handle.nativeId);
        };
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
