# ===========================================
# pages/monitor 应用配置
# ===========================================

configConfig:
  enable: true

routeConfig:
  mode: static
  remoteUrl: ""
  mergeLocalMenu: false
  modulePaths: []
  allowPrefixes: []
  whiteList:
    - /login
    - /403
    - /404
    - /500
  loginPath: /login
  homePath: /
  notFoundPath: /404
  forbiddenPath: /403
  serverErrorPath: /500

appConfig:
  title: Vue Support Monitor
  version: "1.0.0"

# 全局异常监控（默认路径指向后端 /v2/log/report）
monitorConfig:
  enable: false
  reportUrl: /v2/log/report

# 其他配置
otherConfig:
  # 头像框开关
  avatarFrame:
    enable: true
  # 壁纸开关（内置壁纸纯 CSS，不依赖后端；上传走 /v2/file/upload）
  wallpaper:
    enable: true