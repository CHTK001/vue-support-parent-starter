<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)" rx="16"/>
  <!-- 文档背景 -->
  <rect x="80" y="30" width="240" height="180" rx="8" fill="#ffffff" opacity="0.85"/>
  <!-- 扫描线 -->
  <rect x="100" y="60" width="200" height="4" rx="2" fill="#f472b6" opacity="0.6"/>
  <rect x="100" y="80" width="160" height="4" rx="2" fill="#f472b6" opacity="0.4"/>
  <rect x="100" y="100" width="180" height="4" rx="2" fill="#f472b6" opacity="0.4"/>
  <rect x="100" y="120" width="140" height="4" rx="2" fill="#f472b6" opacity="0.4"/>
  <rect x="100" y="140" width="170" height="4" rx="2" fill="#f472b6" opacity="0.4"/>
  <rect x="100" y="160" width="150" height="4" rx="2" fill="#f472b6" opacity="0.4"/>
  <!-- 扫描高亮条 -->
  <rect x="95" y="115" width="210" height="30" rx="4" fill="#ec4899" opacity="0.15">
    <animate attributeName="y" from="55" to="175" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.15" to="0" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- 放大镜 -->
  <circle cx="280" cy="195" r="22" fill="none" stroke="#db2777" stroke-width="4" opacity="0.5"/>
  <line x1="296" y1="211" x2="310" y2="225" stroke="#db2777" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
</svg>
