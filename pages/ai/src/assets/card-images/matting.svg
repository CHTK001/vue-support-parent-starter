<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)" rx="16"/>
  <!-- 人物轮廓 -->
  <circle cx="200" cy="85" r="30" fill="#f9a8d4" opacity="0.7"/>
  <ellipse cx="200" cy="160" rx="50" ry="60" fill="#f472b6" opacity="0.5"/>
  <!-- 虚线裁剪线 -->
  <path d="M120 20 L80 240" stroke="url(#fg)" stroke-width="3" stroke-dasharray="8 6" opacity="0.8"/>
  <path d="M280 20 L320 240" stroke="url(#fg)" stroke-width="3" stroke-dasharray="8 6" opacity="0.8"/>
  <!-- 剪刀图标 -->
  <g transform="translate(310,30) rotate(25)">
    <ellipse cx="0" cy="0" rx="8" ry="14" fill="none" stroke="#db2777" stroke-width="3"/>
    <ellipse cx="16" cy="0" rx="8" ry="14" fill="none" stroke="#db2777" stroke-width="3"/>
    <line x1="12" y1="8" x2="30" y2="28" stroke="#db2777" stroke-width="3" stroke-linecap="round"/>
    <line x1="4" y1="8" x2="-10" y2="28" stroke="#db2777" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
