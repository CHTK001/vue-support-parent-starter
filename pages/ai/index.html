<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon 由 koi 主题 setDocumentFavicon() 在路由进入时按 app.yaml loginConfig.logoUrl 动态设置（@repo/assets 打包资源），不再使用 public 静态副本 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 控制台</title>
  </head>
  <body>
    <!-- 全屏加载动画：防止白屏，应用挂载完成后由 createApp 调用 window.hideAppLoader() 隐藏 -->
    <script src="/loader-config.js"></script>
    <script src="/loader.js"></script>
    <div id="app"></div>
    <!-- rAF 兜底：原生 rAF 优先（可见页与刷新同步、体验不变）；页面隐藏 / 后台标签
         原生 rAF 不触发时，由 setTimeout 16ms 兜底，保证后台标签也能实时渲染与推送 -->
    <script>
      (function () {
        var nRaf = window.requestAnimationFrame
          ? window.requestAnimationFrame.bind(window)
          : null;
        var nCancel = window.cancelAnimationFrame
          ? window.cancelAnimationFrame.bind(window)
          : null;
        window.requestAnimationFrame = function (cb) {
          var fired = false;
          var nativeId = null;
          var timer = setTimeout(function () {
            if (fired) return;
            fired = true;
            cb(performance.now());
          }, 16);
          if (nRaf) {
            nativeId = nRaf(function () {
              if (fired) return;
              fired = true;
              clearTimeout(timer);
              cb(performance.now());
            });
          }
          return { timer: timer, nativeId: nativeId };
        };
        window.cancelAnimationFrame = function (handle) {
          if (!handle) return;
          clearTimeout(handle.timer);
          if (nCancel && handle.nativeId != null) nCancel(handle.nativeId);
        };
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
