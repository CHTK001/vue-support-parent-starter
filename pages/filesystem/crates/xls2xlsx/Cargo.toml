[package]
name = "xls2xlsx"
version = "0.1.0"
edition = "2021"
description = "BIFF(.xls) -> OOXML(.xlsx) 转换器，供文件预览面板在浏览器内把 xls 喂给 @vue-office/excel"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 读：BIFF5/BIFF8（.xls）、xlsx、xlsb、ods
calamine = { version = "0.36", default-features = false, features = ["chrono"] }
# 写：xlsx -> Vec<u8>
#
# `wasm` feature 是**必需**的，不能省：Workbook::new() 会给 docProps/core.xml 写
# dcterms:created，而默认实现走 SystemTime::now() —— wasm32-unknown-unknown 上
# 没有系统时钟，那一行直接 panic（RuntimeError: unreachable，整个模块不可用）。
# 开了 wasm feature 后改用 js_sys::Date::now() 取浏览器时间。
# 见 datetime.rs::system_now 的两套 cfg 实现。
rust_xlsxwriter = { version = "0.99", default-features = false, features = ["chrono", "wasm"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
