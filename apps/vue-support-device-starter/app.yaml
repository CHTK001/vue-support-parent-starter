# 设备管理独立应用配置
#
# 作为独立应用运行时，设备后端不提供登录/令牌服务，关闭前端鉴权守卫；
# 作为子应用嵌入宿主（system / monitor）时，宿主的 app.yaml 会覆盖本文件。
app:
  title: 设备管理
  openAuth: false

routeConfig:
  homePath: /device/preview

# 静态资源层级：设备模块的 API 前缀与宿主机（monitor / system）同一口径，
# dev server 的 proxy 会把 /api/device 转给 DEVICE_API_TARGET。
httpConfig:
  baseUrl: ""
  moduleBaseUrl:
    device: /api/device
  timeout: 30000
  retryCount: 0
  showLoading: false
