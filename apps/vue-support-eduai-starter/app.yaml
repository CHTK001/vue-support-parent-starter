# ===========================================
# 应用配置（vue-support-eduai-starter）
# 教育 AI 工作台：题库 / 组卷 / 扫描识别 / AI 阅卷 / 知识库 / 错题库 / 考试
# 说明：数据按用户隔离（edu_*_user_id），必须登录后才读得到自己的题库与采集任务
# API 走 dev 代理：/v2/edu -> 本地 eduai 后端（见 vite.config.ts）
# ===========================================

# 系统信息
appConfig:
  title: 教育 AI 工作台
  openAuth: true

# 路由：静态路由（路由树即菜单树，由 .routes() 注入）
routeConfig:
  mode: static
  # 免登录可达的路由白名单。
  #
  # 为什么必须在这里配：框架默认白名单是 ["/login", "/403", "/404", "/500"]，
  # 而路由守卫的最后一步是「无 token 一律重定向 route.loginPath」。
  # 学生登录页不在默认白名单里，于是未登录访问 /edu/student-login 会被推到
  # 管理后台的 /login —— 学生拿自己的学号根本登不进去（实测确认）。
  #
  # 为什么不能写在 main.ts 的 defaults 里：defaults 的合并顺序排在
  # app.example.yaml / app.yaml / app.{env}.yaml / 远程配置 / 环境变量「之前」，
  # 即优先级最低，会被这里的配置盖掉。实测用 defaults 配 whiteList 不生效。
  #
  # 框架语义是「非空即整体覆盖」（guard.ts: route.whiteList?.length ? ... : 默认值），
  # 所以必须把默认那几个一并列出，否则 403/404 也会被要求登录。
  whiteList:
    - /login
    - /403
    - /404
    - /500
    # 学生登录页（学号 / 家长手机号登录入口）。
    # 教师没有独立登录页：教师走管理后台的 /login，故不放 /edu/teacher。
    - /edu/student-login

# API 基础路径（dev 代理已处理前缀，留空走相对路径 /v2/edu/**）
httpConfig:
  baseUrl: ""
  # 401/403 鉴权失败行为（免登录场景不触发）
  authFailAction: confirm

# 登录页配置（免登录场景仅用于兜底）
loginConfig:
  captcha: false
  otp: false
  slider: false
  brandName: 教育 AI 工作台
  title: 教育 AI 工作台
  description: 题库 · AI 组卷 · 扫描识别 · AI 阅卷 · 知识库 · 错题库
  beiAnHao: ""

# 其他配置
other:
  # 主题（koi）
  themeId: "koi"
  # 工具栏显隐：登录后可见用户入口，其余按本应用需要裁剪
  toolbar:
    searchMenu: false
    refresh: true
    dark: true
    language: false
    fullScreen: true
    themeSetting: true
    user: true
    breadcrumb: true
    breadcrumbDropdown: true
    breadcrumbIcon: false
    tabIcon: true
    logo: true
    message: false
    weather: false
    collapse: false
  # 天气（未配置定位时隐藏）
  weather:
    enable: false

# 布局配置
layoutConfig:
  enable: true
  source: local

# 菜单配置
menuConfig:
  collapseSingleChild: true
  # 分组导航增强（默认 true，main.ts 的 defaults 里也声明了同一项）：
  # 分组标题按分区标题排版（加大/加粗/深色），纵向布局底部显示「图标 + 设置文字」整行条目。
  # 分组标题不折叠、子项常显（不显示下拉箭头）。
  groupNav: true