# 教育 AI 应用配置
routeConfig:
  mode: static
  mergeLocalMenu: false
  modulePaths: []
  allowPrefixes: []
  whiteList:
    - /login
    - /403
    - /404
    - /500
  loginPath: /login
  homePath: /edu
  notFoundPath: /404
  forbiddenPath: /403
  serverErrorPath: /500

appConfig:
  title: 教育 AI 工作台
  version: "1.0.0"
  systemCode: eduai
  openAuth: false

loginConfig:
  captcha: false
  otp: false
  slider: false
  brandName: EDU-AI
  welcome: 欢迎登录
  title: 教育 AI 工作台
  description: 题库/组卷/阅卷/知识库/错题

httpConfig:
  baseUrl: "/v2/edu"
  apiVersion: ""
  enable: true
  encrypt: false
  timeout: 60000
  retryCount: 3
  retryDelay: 1000
  showLoading: true

storageConfig:
  encode: false
  key: "EDUAI_KOI"
  prefix: "eduai-"

securityConfig:
  baiduJs:
    enable: false
    url: ""
    jumpUrl: ""
  dynamicFont:
    enable: false
  ocrObfuscation:
    enable: false
  watermark:
    enable: false
    text: "EDU-AI"
    color: "#67C23A"
    alpha: 0.2
    rotate: -20

permissionConfig:
  superadmin: "superadmin"
  admin: "admin"

tokenConfig:
  autoRefresh: false
  accessTokenKey: "accessToken"
  refreshTokenKey: "refreshToken"
  refreshUrl: ""
  refreshInterval: 300000
  advanceRefresh: 60000

i18nConfig:
  defaultLocale: zh-CN
  locales:
    - zh-CN

layoutConfig:
  source: local
  remoteUrl: ""

uploadConfig:
  url: ""
  maxSize: 20971520
  accept:
    - ".xlsx"
    - ".xls"
    - ".json"
    - ".pdf"
    - ".docx"

envConfig:
  env: dev

systemConfig:
  showMessage: false
  showConfig: false
  showLog: false
  showMonitor: false

aiConfig:
  enable: false

crypto:
  wasmUrl: ""
  algorithm: "aes"

socketConfig:
  enable: false
  protocol: websocket
  urls: ""
  context: "/socket.io"
  path: "/ws"
  autoConnect: false
  reconnection: true
  reconnectionAttempts: 3
  reconnectionDelay: 1000
  heartbeatInterval: 30000
  transports:
    - websocket

other:
  themeId: "koi"
  themeConfigCloseConfirm: false
  toolbar:
    searchMenu: false
    refresh: true
    dark: false
    language: false
    fullScreen: false
    themeSetting: false
    user: false
    breadcrumb: true
    breadcrumbDropdown: false
    breadcrumbIcon: true
    tabIcon: false
    logo: true
    message: false