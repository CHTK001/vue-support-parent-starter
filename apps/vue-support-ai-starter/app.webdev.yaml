# ===========================================
# webdev 环境级配置（覆盖 app.yaml 对应字段）
# 注意：该文件必须存在——缺失时 vite dev 的 SPA fallback 会返回 index.html
# （HTTP 200 text/html），被配置加载器误当 YAML 解析后把 route 覆盖丢回
# 默认值 homePath=/home，而 Router 没有该路由，导致整站重定向死循环白屏。
# ===========================================

routeConfig:
  mode: static
  homePath: /guid
