# ===========================================
# 应用配置（vue-support-ai-starter —— AI 控制台）
# ===========================================

# 系统信息
appConfig:
  title: AI 控制台
  systemCode: ai-guada
  # 登录与路由守卫统一走 vue 框架（@repo/core 的 createAppRouter /
  # setupRouterGuard）。本应用只提供布局路由与业务页，不再自写登录页与 beforeEach。
  # openAuth 必须保持 true：置 false 时框架守卫直接放行，前端不再做登录态判断。
  openAuth: true

  # 品牌 Logo / favicon 统一由 getConfig('app') 提供，组件与 index.html 不再硬编码
  logoUrl: /images/guada_logo_small.png
  logoLargeUrl: /images/guada_logo.png
  favicon: /images/guada_logo.png

# 路由：静态路由由 main.js 自行创建，不使用框架远程菜单
# homePath/loginPath 由框架守卫读取：
# - homePath 必须对齐本应用首页（"/" → 布局再 redirect 到 /chat/new-session），
#   否则「已登录访问 /login」会被框架弹到一个不存在的 /home；
# - whiteList 里放免登录页；其余路径一律要求框架令牌。
routeConfig:
  mode: static
  homePath: "/"
  loginPath: "/login"
  forbiddenPath: "/403"
  whiteList:
    - /login
    - /password

# 登录页配置：登录页整页复用 koi 主题的登录模板（左侧品牌视觉 + 右侧 ReLoginForm），
# 这里只声明品牌文案与能力开关，不再维护 AI 自己的登录页。
# captcha 必须显式置 false —— 框架默认 true，会去请求图形验证码接口；AI 后端
# 未实现该接口时登录页会显示「系统暂时不可用」，表单根本出不来。
# OTP / 滑块保持关闭，AI 后端按账号密码登录即可。
loginConfig:
  captcha: false
  otp: false
  slider: false
  brandName: "AI 控制台"
  title: "AI 控制台"
  welcome: "欢迎登录"
  description: "使用统一账号登录"
  logoUrl: /images/guada_logo.png

# API 基础路径：框架接口地址（urlConfig.*）自带 /v2 前缀，这里必须留空避免二次拼接；
# AI 业务客户端的 /v2 前缀由 src/framework/context.ts 显式携带（经 vite proxy → 8787）。
httpConfig:
  baseUrl: ""
  timeout: 30000
  showLoading: false
  encrypt: false
  sign: false
  # 后端 codec 协议请求体加密（对齐服务端 plugin.api.decode）：
  # 登录等敏感请求按 .codec(true) 走 access-control-origin-key + AES-256-CBC 加密传输。
  # key 必须与服务端 plugin.api.decode.codec-request-key 一致，type 与 codec-type 对齐
  # （aes 走 AES-256-CBC/PKCS7；sm4/des 后端仅做 hex 编解码）。
  # 服务端 plugin.api.decode.codec-request-key 已配置（198 上 sys_setting 表
  # startup-api 组，EnvironmentPostProcessor 启动期注入；type 同为 aes）。
  # 2026-10-13 端到端验收：curl 带头 + AES 载荷登录 200，垃圾载荷 400。
  requestCodec:
    enable: true
    key: "e3eccc79fe899fcd06b380126930d61c"
    type: "aes"
  # 本应用各页面已自行展示后端 msg（ElMessage / toast），关闭框架重复提示；
  # 拦截器仍负责 401/403 跳登录与业务失败 reject。
  # ⚠ 务必确认这份配置真的被前端读到：app.yaml 走 /apps/{appName}/app.yaml，
  # 若被网关/静态服务误配（如同前缀被反代到后端），前端会静默退回 app.example.yaml，
  # 而 example 里没有 toast 段 → 落到代码默认值 enable:true → 业务失败照弹全局提示。
  # 自检：浏览器直接访问 {站点}/apps/vue-support-ai-starter/app.yaml，应返回 yaml 文本而非 403/HTML。
  toast:
    enable: false

# 远程配置中心（/v2/setting/default 由 system 后端提供，AI 后端未实现）关闭拉取
configConfig:
  enable: false

# 令牌：accessToken 由框架 storage 统一读写，业务侧不再自行存 localStorage
tokenConfig:
  refresh: false
  autoRefresh: false

# 布局与菜单：本应用不使用框架布局
layoutConfig:
  enable: false
  source: local

# Socket / 异常监控关闭（AI 控制台无对应后端通道）
socketConfig:
  enable: false

monitorConfig:
  enable: false

# ===========================================
# 业务能力与顶栏开关
#
# AI 控制台**没有顶部菜单栏**。它的 Header 是自研的 PageHeader.vue
# （侧栏折叠 + 标题 + 页面自定义 actions 插槽 + 窗口控制），不消费 koi 的
# ReToolbar，因此天气 / 台风 / 搜索 / 刷新 / 面包屑 / 主题设置 / 语言 / 全屏 /
# 用户菜单这些顶栏条目在本应用里根本不存在对应 UI。
#
# 所以这里把顶栏类条目与相关后台能力一并关闭：
#   - other.capabilities.*  false：前端连 HEAD 探测都不发（backendProbe.ts 的开关判定）；
#   - other.toolbar.*       false：万一哪天复用 koi Header，也不会渲染这些入口；
#   - other.weather.enable  false：天气的显隐总开关（ReWeather / useWeather 都看它）。
#
# 只关 toolbar 而留着 capabilities 是不够的：组件仍会轮询 /v2/weather/overview，
# 后端没有数据源时会把「无可用天气数据源」弹成全局 toast。故按"整块关闭"处理，
# 并且删掉了 pages/ai/src/components/TopEnvironment.vue（空模板却仍在轮询的那个组件）。
#
# 将来若要在 AI 控制台展示天气：从 git 历史取回 TopEnvironment.vue 并补全模板，
# 再把下面 weather / location / typhoon / toolbar.weather / weather.enable 改回 true，
# 同时给 other.weather 配上经纬度。
# ===========================================
other:
  capabilities:
    weather: false
    location: false
    typhoon: false
    # ipLookup 一直是关的：/v2/ip/lookup 由 api 业务层的 SysIpController 提供，
    # AI 后端（8787）未引入，探测必然落空。
    ipLookup: false
  toolbar:
    searchMenu: false
    refresh: false
    dark: false
    language: false
    fullScreen: false
    themeSetting: false
    user: false
    breadcrumb: false
    breadcrumbDropdown: false
    breadcrumbIcon: false
    tabIcon: false
    logo: false
    message: false
    announcement: false
    weather: false
    typhoon: false
    collapse: false
  weather:
    enable: false
