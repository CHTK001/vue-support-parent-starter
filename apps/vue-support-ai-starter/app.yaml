# ===========================================
# 应用配置（vue-support-ai-starter —— NomiFun AI）
# 这是 NomiFun AI 的正式启动入口配置；
# pages/ai 仅作为渲染器模块被引用，不在此处承担启动角色。
# ===========================================

# 系统信息
appConfig:
  title: NomiFun AI
  version: "0.6.4"
  systemCode: ai
  openAuth: false

# 路由：本地静态 + 远程菜单合并
routeConfig:
  mode: static
  homePath: /guid

# 登录页配置
loginConfig:
  captcha: false
  otp: false
  slider: false
  brandName: NomiFun AI
  welcome: 欢迎使用 NomiFun AI
  title: NomiFun AI
  description: NomiFun AI · 多模型对话与智能体协作平台
  logoUrl: /assets/images/logo/logo.webp
  imageUrl: /assets/images/login/science.png

# API 基础路径（前后端同源部署时由反代处理）
httpConfig:
  baseUrl: ""
  encrypt: false
  sign: false

# 浏览器存储前缀（与 pages/ai 保持一致以复用同一套本地缓存）
storageConfig:
  prefix: ai
  encode: false

# 全局异常上报
monitorConfig:
  enable: false
  reportUrl: /v2/log/report

# 其他配置
otherConfig:
  avatarFrame:
    enable: true

# 布局配置
layoutConfig:
  enable: true
  source: local

# 菜单配置
menuConfig:
  collapseSingleChild: true
