# vue-support-ai-starter 应用配置（覆盖 app.example.yaml 全局模板）
# 后端接口统一前缀：context-path=/api/ai，controller=/v2/xxx → 完整 /api/ai/v2/xxx
configConfig:
  enable: false

httpConfig:
  baseUrl: "/api/ai"
  apiVersion: ""
  enable: true
  encrypt: false
  timeout: 30000
  retryCount: 3
  retryDelay: 1000
  showLoading: true

# 全局异常监控（默认路径指向后端 /v2/log/report）
monitorConfig:
  enable: false
  reportUrl: /v2/log/report

# 其他配置
otherConfig:
  # 头像框开关
  avatarFrame:
    enable: true

# 布局配置（首页仪表板持久化：local=本地 localStorage / remote=远程同步）
layoutConfig:
  enable: true
  source: local
