# ===========================================
# vue-support-ai-starter 应用配置
# ===========================================

# 配置中心
configConfig:
  remoteSettingUrl: "http://localhost:8080/v2/ai/global-settings"

# 路由配置
routeConfig:
  mode: static
  remoteUrl: ""
  mergeLocalMenu: false
  modulePaths: []
  allowPrefixes: []
  whiteList:
    - /login
    - /403
    - /404
    - /500
  loginPath: /login
  homePath: /chat
  notFoundPath: /404
  forbiddenPath: /403
  serverErrorPath: /500

# 系统信息
appConfig:
  title: Vue Support AI
  version: "1.0.0"
  systemCode: ai
  openAuth: false

# 登录页配置
loginConfig:
  captcha: true
  otp: false
  slider: false
  brandName: KOI-AI
  logoUrl: /assets/images/logo/logo.webp
  welcome: menu.login.welcome
  title: menu.login.title
  description: menu.login.description
  imageUrl: /assets/images/login/science.png
  featureTags:
    - icon: ChatDotRound
      text: menu.login.featureTags.chat
    - icon: Picture
      text: menu.login.featureTags.image
    - icon: VideoCamera
      text: menu.login.featureTags.video
  beiAnHao: "豫ICP备2022022094号-1"

# 请求配置
httpConfig:
  baseUrl: "/v2/ai"
  apiVersion: ""
  enable: true
  encrypt: false
  timeout: 30000
  retryCount: 3
  retryDelay: 1000
  showLoading: true

# 缓存与存储配置
storageConfig:
  encode: true
  key: "2XNN4K8LC0ELVWN4"
  prefix: "ai-"
  noPrefixKeys:
    - token
    - userInfo

# 安全配置
securityConfig:
  baiduJs:
    enable: false
    url: ""
    jumpUrl: ""
  dynamicFont:
    enable: false
  ocrObfuscation:
    enable: false
  watermark:
    enable: false
    text: "KOI-AI"
    color: "#409EFF"
    alpha: 0.2
    rotate: -20

# 权限配置
permissionConfig:
  superadmin: "superadmin"
  admin: "admin"

# 令牌配置
tokenConfig:
  autoRefresh: true
  accessTokenKey: "accessToken"
  refreshTokenKey: "refreshToken"
  refreshUrl: "/v2/ai/token/refresh"
  refreshInterval: 300000
  advanceRefresh: 60000

# 国际化配置
i18nConfig:
  defaultLocale: zh-CN
  locales:
    - zh-CN
    - en-US

# 用户布局配置
layoutConfig:
  source: local
  remoteUrl: ""

# 上传配置
uploadConfig:
  url: ""
  maxSize: 10485760
  accept:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
    - ".zip"

# 环境配置
envConfig:
  env: dev

# 系统配置
systemConfig:
  showMessage: false
  showConfig: false
  showLog: true
  showMonitor: false

# AI 配置
aiConfig:
  enable: false
  url: ""
  model: ""
  apiKey: ""

# 加密配置
crypto:
  wasmUrl: "/wasm/crypto-wasm.js"
  algorithm: "aes"

# Socket 连接配置
socketConfig:
  enable: false
  protocol: websocket
  urls: ""
  context: "/socket.io"
  path: "/ws"
  autoConnect: true
  reconnection: true
  reconnectionAttempts: 3
  reconnectionDelay: 1000
  heartbeatInterval: 30000
  transports:
    - websocket

# 其它配置
other:
  themeId: "koi"
  themeConfigCloseConfirm: false
  toolbar:
    searchMenu: false
    refresh: false
    dark: true
    language: true
    fullScreen: true
    themeSetting: false
    user: false
    breadcrumb: false
    breadcrumbDropdown: false
    breadcrumbIcon: false
    tabIcon: false
    logo: true
    message: false
  # 无障碍配置
  accessibility:
    enable: true
    screenReaderMode: false
    highContrastMode: false
    voiceReadEnabled: false
  # 开发工具配置（仅开发/测试环境生效）
  devTools:
    enable: true
    devLiteTools: false
    devRuler: false
    devGrid: false
    devHoverInspector: false
  # 热力图配置（仅开发/测试环境生效）
  heatmap:
    enable: true
    devHeatmap: false
  # 性能监控配置
  performance:
    enable: true
    fpsMonitorEnabled: false
    memoryMonitorEnabled: false
    cpuMonitorEnabled: false
    bandwidthMonitorEnabled: false
    batteryMonitorEnabled: false
    bluetoothMonitorEnabled: false
    screenMonitorEnabled: false
    performanceMonitorPosition: "top-right"
    performanceMonitorMode: "simple"
    performanceMonitorLayout: "merged"
    performanceMonitorDirection: "auto"
  # AI 对话配置
  aiChat:
    enable: true
    aiChatEnabled: false
    aiChatMode: "webllm"
    aiChatModel: "Qwen2.5-1.5B-Instruct-q4f16_1-MLC"
    aiChatVendor: "openai"
    aiChatApiKey: ""
    aiChatApiUrl: ""
    aiChatMaxTokens: 512
    aiChatTemperature: 0.7
