# ===========================================
# 应用程序基础配置
# ===========================================
# 系统名称
Title: 系统管理V2
# 平台标识码
SystemCode: system-v2
# 远程API地址
BaseUrl: /system/api

# ===========================================
# 鉴权与登录配置
# ===========================================
# 是否开启远程权限控制
OpenAuth: false
# 是否开启基础登录
OpenBaseLogin: true
# 是否开启刷新token
OpenShowRefreshToken: true
# 登录成功后跳转路径（覆盖内置默认值）
PostLoginRedirect: /home

# ===========================================
# 布局与菜单配置
# ===========================================
# 是否自动远程菜单-从后端获取菜单
RemoteMenu: true
# 是否在远程菜单基础上合并本地菜单
MergeLocalMenu: true
# 远程菜单只保留系统管理壳允许的路径
RemoteMenuAllowPrefixes:
  - /home
  - /manage
  - /dashboard

# ===========================================
# 界面显示配置
# ===========================================
# 是否显示Logo
ShowLogo: true
# 侧边栏状态-true展开-false收起
SidebarStatus: true

# ===========================================
# 主题与样式配置
# ===========================================
# 主题模式-light浅色-dark深色
Theme: light
# 主题色
EpThemeColor: "#409EFF"
# 布局圆角-像素
LayoutRadius: 10

# ===========================================
# 缓存与存储配置
# ===========================================
# 是否开启组件缓存
KeepAlive: true
# 是否开启动态路由缓存
CachingAsyncRoutes: true
# 显示工具栏设置按钮
ShowBarSetting: true

# ===========================================
# 请求配置
# ===========================================
Request:
  enable: true
  timeout: 30000
  retryCount: 3
  retryDelay: 1000
  showLoading: true
  enableSign: false

# ===========================================
# 登录页主题配置
# ===========================================
LoginTheme: koi
# 布局主题皮肤
SystemTheme: koi
EnableFestivalTheme: true
EnableLoginThemeSwitcher: true