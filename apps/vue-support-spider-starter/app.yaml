# 爬虫中心 Vue 应用配置
routeConfig:
  mode: static
  mergeLocalMenu: false
  modulePaths: []
  allowPrefixes: []
  whiteList:
    - /login
    - /403
    - /404
    - /500
  loginPath: /login
  homePath: /home
  notFoundPath: /404
  forbiddenPath: /403
  serverErrorPath: /500

appConfig:
  title: 爬虫中心
  version: "1.0.0"
  systemCode: spider
  openAuth: false

loginConfig:
  captcha: false
  otp: false
  slider: false
  brandName: SPIDER
  welcome: 欢迎登录
  title: 爬虫中心
  description: 可视化编排 + 实时运行控制

httpConfig:
  baseUrl: "http://localhost:19091/spider-api"
  apiVersion: ""
  enable: true
  encrypt: false
  timeout: 30000
  retryCount: 3
  retryDelay: 1000
  showLoading: true

storageConfig:
  encode: false
  key: "SPIDER_KOI"
  prefix: "spider-"

securityConfig:
  baiduJs:
    enable: false
    url: ""
    jumpUrl: ""
  dynamicFont:
    enable: false
  ocrObfuscation:
    enable: false
  watermark:
    enable: false
    text: "SPIDER"
    color: "#409EFF"
    alpha: 0.2
    rotate: -20

permissionConfig:
  superadmin: "superadmin"
  admin: "admin"

tokenConfig:
  autoRefresh: false
  accessTokenKey: "accessToken"
  refreshTokenKey: "refreshToken"
  refreshUrl: ""
  refreshInterval: 300000
  advanceRefresh: 60000

i18nConfig:
  defaultLocale: zh-CN
  locales:
    - zh-CN

layoutConfig:
  source: local
  remoteUrl: ""

uploadConfig:
  url: ""
  maxSize: 10485760
  accept:
    - ".json"
    - ".yml"
    - ".yaml"

envConfig:
  env: dev

systemConfig:
  showMessage: false
  showConfig: false
  showLog: false
  showMonitor: false

aiConfig:
  enable: false

crypto:
  wasmUrl: ""
  algorithm: "aes"

socketConfig:
  enable: false
  protocol: websocket
  urls: ""
  context: "/socket.io"
  path: "/ws"
  autoConnect: false
  reconnection: true
  reconnectionAttempts: 3
  reconnectionDelay: 1000
  heartbeatInterval: 30000
  transports:
    - websocket

other:
  themeId: "koi"
  themeConfigCloseConfirm: false
  toolbar:
    searchMenu: false
    refresh: false
    dark: false
    language: false
    fullScreen: false
    themeSetting: false
    user: false
    breadcrumb: true
    breadcrumbDropdown: false
    breadcrumbIcon: true
    tabIcon: false
    logo: true
    message: false