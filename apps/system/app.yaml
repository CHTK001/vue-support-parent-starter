# ===========================================
# system 应用基础配置
# ===========================================

configConfig:
  remoteSettingUrl: ""

routeConfig:
  # 路由来源模式：
  #   static  - 业务路由写死代码里（createAppRouter 的 routes）
  #   module  - 按 monorepo page 模块装配（modulePaths 指定模块路径）
  #   remote  - 业务路由由后端菜单接口返回，动态注册到 layout
  mode: static
  # 远程菜单接口地址（mode=remote 时生效）
  remoteUrl: ""
  # 远程模式下是否合并本地静态业务路由（mode=remote 时生效）
  mergeLocalMenu: false
  # 本地页面模块路径（mode=module 时生效，对应 monorepo pages 目录）
  modulePaths: []
  # 远程菜单允许的路径前缀白名单（为空不过滤；命中保留，未命中过滤）
  allowPrefixes: []
  # 无需登录即可访问的路由白名单
  whiteList:
    - /login
    - /403
    - /404
    - /500
  # 登录页路径
  loginPath: /login
  # 首页路径（layout 重定向目标）
  homePath: /home
  # 404 路径
  notFoundPath: /404
  # 403 路径
  forbiddenPath: /403
  # 500 路径
  serverErrorPath: /500

appConfig:
  title: 系统管理
  version: "1.0.0"
  systemCode: system
  openAuth: true

httpConfig:
  baseUrl: ""
  apiVersion: ""
  enable: true
  encrypt: false
  timeout: 30000
  retryCount: 3
  retryDelay: 1000
  showLoading: true

storageConfig:
  encode: true
  key: "2XNN4K8LC0ELVWN4"
  prefix: "system-"
  noPrefixKeys:
    - token
    - userInfo

securityConfig:
  baiduJs:
    enable: false
    jumpUrl: ""
  dynamicFont:
    enable: false
  ocrObfuscation:
    enable: false

permissionConfig:
  superadmin: "superadmin"
  admin: "admin"

tokenConfig:
  autoRefresh: false
  accessTokenKey: "accessToken"
  refreshTokenKey: "refreshToken"
  refreshUrl: ""
  refreshInterval: 300000
  advanceRefresh: 60000

i18nConfig:
  defaultLocale: zh-CN
  locales:
    - zh-CN
    - en-US

layoutConfig:
  source: local
  remoteUrl: ""

uploadConfig:
  url: ""
  maxSize: 10485760
  accept:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
    - ".zip"

envConfig:
  env: dev

systemConfig:
  showMessage: true
  showConfig: true
  showLog: true
  showMonitor: true

aiConfig:
  enable: false
  url: ""
  model: ""
  apiKey: ""

crypto:
  wasmUrl: "/wasm/crypto-wasm.js"
  algorithm: "aes"

other:
  themeId: "koi"
