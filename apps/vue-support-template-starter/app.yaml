# 模板库独立应用配置
#
# 作为独立应用运行时，模板后端不提供登录/令牌服务，关闭前端鉴权守卫；
# 作为子应用嵌入宿主（system / monitor）时，宿主的 app.yaml 会覆盖本文件。
app:
  title: 模板库
  openAuth: false

routeConfig:
  homePath: /template

# 模块独立后端基础路径（如 device→/api/device；template→/api/template；缺省回退 baseUrl）
httpConfig:
  moduleBaseUrl:
    template: /api/template
