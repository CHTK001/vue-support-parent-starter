# ===========================================
# vue-support-template-starter 应用配置
# 组件模板预览与调试工具
# 注意：所有 starter 的 app.yaml 均从此模板复制，修改此处即可统一更新默认值。
# ===========================================

# 配置中心
configConfig:
  remoteSettingUrl: ""

# 路由配置
routeConfig:
  mode: static
  remoteUrl: ""
  mergeLocalMenu: false
  modulePaths: []
  allowPrefixes: []
  whiteList:
    - /login
    - /home
    - /debug
    - /403
    - /404
    - /500
  loginPath: /login
  homePath: /home
  personagePath: /system/personage
  notFoundPath: /404
  forbiddenPath: /403
  serverErrorPath: /500

# 系统信息
appConfig:
  title: Vue Support
  version: "0.7.0"
  systemCode: system
  openAuth: false

# 登录页配置（支持 i18n key 如 menu.login.title，也支持字面量）
loginConfig:
  captcha: true
  otp: false
  slider: false
  brandName: ADMIN
  logoUrl: /assets/images/logo/logo.webp
  welcome: 欢迎登录
  title: ADMIN 管理平台
  description: 或许我们只是差点运气
  imageUrl: /assets/images/login/science.png
  featureTags:
    - icon: DataAnalysis
      text: 高效管理
    - icon: Brush
      text: 现代设计
    - icon: Lock
      text: 安全可靠
  beiAnHao: ""

# 请求配置
httpConfig:
  baseUrl: ""
  apiVersion: ""
  enable: true
  encrypt: false
  timeout: 10000
  retryCount: 3
  retryDelay: 1000
  showLoading: true
  sign: false
  signSecret: ""

# 缓存与存储配置
storageConfig:
  encode: true
  key: "2XNN4K8LC0ELVWN4"
  prefix: ""
  noPrefixKeys: []

# 安全配置
securityConfig:
  baiduJs:
    enable: false
    url: ""
    action: clear
    jumpUrl: ""
  dynamicFont:
    enable: false
  ocrObfuscation:
    enable: false
  watermark:
    enable: false
    text: ""
    color: "#409EFF"
    alpha: 0.2
    rotate: -20

# 权限配置
permissionConfig:
  superadmin: superadmin
  admin: admin

# 令牌配置
tokenConfig:
  autoRefresh: false
  accessTokenKey: accessToken
  refreshTokenKey: refreshToken
  userInfoKey: userInfo
  refreshUrl: ""
  refreshInterval: 300000
  advanceRefresh: 60000

# 国际化配置
i18nConfig:
  defaultLocale: zh-CN
  locales:
    - zh-CN
    - en-US

# 用户布局配置
layoutConfig:
  source: local
  remoteUrl: ""

# 上传配置
uploadConfig:
  url: ""
  maxSize: 10485760
  accept:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
    - ".zip"

# 接口地址（集中管理）
urlConfig:
  login: /v2/user/login
  logout: /v2/user/logout
  me: /v2/user/me
  refreshToken: /v2/user/refresh-token
  captcha: /v1/captcha
  setting: /v2/setting/default
  menu: /v2/user/menu
  layout: /v2/user/layout

# 环境配置
envConfig:
  env: dev

# 系统配置
systemConfig:
  showMessage: true
  showConfig: true
  showLog: true
  showMonitor: true

# AI 配置
aiConfig:
  enable: false
  url: ""
  model: ""
  apiKey: ""

# 加密配置
cryptoConfig:
  wasmUrl: /wasm/crypto-wasm.js
  algorithm: aes

# Socket 连接配置
socketConfig:
  enable: false
  protocol: socketio
  urls: ""
  context: /socket.io
  path: /ws
  query: {}
  autoConnect: true
  reconnection: true
  reconnectionAttempts: 3
  reconnectionDelay: 1000
  heartbeatInterval: 30000
  transports:
    - websocket

# 消息通知配置
messageConfig:
  position: toolbar
  maxUnread: 99
  socket: true
  listUrl: /v2/message/sys-message/page
  unreadUrl: /v2/message/sys-message/unread-count
  readUrl: /v2/message/sys-message/read

# 其它配置
other:
  themeId: koi
  themeConfigCloseConfirm: false
  statusColors:
    success: "#67C23A"
    warning: "#E6A23C"
    danger: "#F56C6C"
    info: "#909399"
  toolbar:
    searchMenu: true
    refresh: true
    dark: true
    language: true
    fullScreen: true
    themeSetting: true
    user: true
    breadcrumb: true
    breadcrumbDropdown: true
    breadcrumbIcon: true
    tabIcon: true
    logo: true
    message: true
    collapse: true
  timer:
    enable: false
    zones: []
  accessibility:
    enable: true
    screenReaderMode: false
    highContrastMode: false
    voiceReadEnabled: false
  devTools:
    enable: true
    devLiteTools: false
    devRuler: false
    devGrid: false
    devHoverInspector: false
  heatmap:
    enable: true
    devHeatmap: false
  performance:
    enable: true
    fpsMonitorEnabled: false
    memoryMonitorEnabled: false
    cpuMonitorEnabled: false
    bandwidthMonitorEnabled: false
    batteryMonitorEnabled: false
    bluetoothMonitorEnabled: false
    screenMonitorEnabled: false
    performanceMonitorPosition: top-right
    performanceMonitorMode: simple
    performanceMonitorLayout: merged
    performanceMonitorDirection: auto
  aiChat:
    enable: true
    aiChatEnabled: false
    aiChatMode: webllm
    aiChatModel: Qwen2.5-1.5B-Instruct-q4f16_1-MLC
    aiChatVendor: openai
    aiChatApiKey: ""
    aiChatApiUrl: ""
    aiChatMaxTokens: 512
    aiChatTemperature: 0.7