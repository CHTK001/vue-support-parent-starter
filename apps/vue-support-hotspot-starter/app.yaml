# ===========================================
# 应用配置（vue-support-hotspot-starter）
# ===========================================

appConfig:
  title: APM 热点观测台
  openAuth: true

  # 鉴权开关。**必须保持 true**：置 false 时 router/guard.ts 与 router/access.ts
  # 都会直接放行 —— 前端不再做任何登录态与权限判断（后端 AuthFilter 仍在，
  # 所以不是越权漏洞，但用户会看到空菜单、刷新即掉登录态）。
  # 历史上曾为了绕开「白名单路由没被消费」的守卫 bug 而置 false，
  # 该 bug 已修（guard.ts 现已实际消费 route.whiteList），无需再关。
# 路由：静态模式（业务路由由代码提供，前后端分离，后端纯 REST）
routeConfig:
  mode: static

# API 基础路径（dev 走 vite proxy → :8086）
httpConfig:
  baseUrl: /

loginConfig:
  captcha: false
  otp: false
  slider: false
  brandName: Hotsport
  title: APM 热点观测台

otherConfig:
  avatarFrame:
    enable: false
