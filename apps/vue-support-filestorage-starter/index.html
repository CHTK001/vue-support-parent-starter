<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>文件管理</title>
  <!-- favicon 兜底：本应用 public 目录为空，用 data URI 内置图标（不依赖任何静态资源），
       保证 HTML 一到浏览器、以及整页刷新窗口内标签页就有图标，避免浏览器回退请求
       /favicon.ico 404 导致标签页无图标。 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20128%20128'%20fill='none'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0%25'%20y1='0%25'%20x2='100%25'%20y2='100%25'%3E%3Cstop%20offset='0%25'%20stop-color='%234A9BD9'/%3E%3Cstop%20offset='100%25'%20stop-color='%235AC8A0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx='64'%20cy='64'%20r='56'%20fill='url(%23g)'/%3E%3Cpath%20d='M40%2052%20L56%2044%20L72%2052%20L72%2068%20L56%2076%20L40%2068%20Z'%20fill='white'%20opacity='0.95'/%3E%3Cpath%20d='M56%2060%20L72%2052%20L88%2060%20L88%2076%20L72%2084%20L56%2076%20Z'%20fill='white'%20opacity='0.7'/%3E%3Ccircle%20cx='64'%20cy='64'%20r='6'%20fill='white'/%3E%3C/svg%3E" />
  <!--
    文件管理页壳（多页入口之一）。

    为什么必须有这个文件：vite.config.ts 把 index.html 列为构建入口
    （`main: path.resolve(root, "index.html")`），scripts/sync-to-fs-server.ps1
    又要把 `dist/index.html` 同步到后端 static/index.html（供 FileStorageServerFilter
    直出）。它一旦缺失，`pnpm build` 直接失败、dev 下访问 `/` 也是 404 ——
    后端 static/index.html 里已经引用了 hash 化的 assets，可证这份源码壳原本存在，
    只是此前被根 .gitignore 的 `apps/*/index.html` 防御性规则连带忽略、从未提交。

    与 preview.html 同构，只换入口脚本与标题：
      index.html   -> /src/main.ts    （文件管理，FileStorageManage）
      preview.html -> /src/preview.ts （统一预览入口，由 readPreviewShell 注入引导参数）
  -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
