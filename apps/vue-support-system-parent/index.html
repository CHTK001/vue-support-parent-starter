<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0" />
    <title>后台系统</title>
    <link rel="icon" href="/favicon.ico" />
    <script>
      try {
        var htmlEl = document.documentElement;
        var layoutStorage = localStorage.getItem('responsive-layout');
        var configureStorage = localStorage.getItem('responsive-configure');
        var themeKey = 'default';
        var shouldUseDark = false;

        var applyBootThemeState = function () {
          htmlEl.classList.toggle('dark', shouldUseDark);
          htmlEl.setAttribute('data-theme', shouldUseDark ? 'dark' : 'light');
          htmlEl.setAttribute('data-skin', themeKey);
          Array.from(htmlEl.classList)
            .filter(function (className) {
              return className.indexOf('theme-') === 0;
            })
            .forEach(function (className) {
              htmlEl.classList.remove(className);
            });
          htmlEl.classList.add('theme-' + themeKey);
        };

        if (layoutStorage) {
          var layoutConfig = JSON.parse(layoutStorage);
          shouldUseDark = !!layoutConfig.darkMode;
        } else if (
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        ) {
          shouldUseDark = true;
        }

        if (configureStorage) {
          var configure = JSON.parse(configureStorage);
          if (
            configure &&
            typeof configure.systemTheme === 'string' &&
            configure.systemTheme.trim()
          ) {
            themeKey = configure.systemTheme.trim();
          }
        }

        if (themeKey === 'pixel-art' || themeKey === '8-bit') {
          themeKey = '8bit';
        }

        applyBootThemeState();
        if (typeof requestAnimationFrame === 'function') {
          requestAnimationFrame(applyBootThemeState);
        }
        setTimeout(applyBootThemeState, 0);
        setTimeout(applyBootThemeState, 300);
      } catch (e) {}
    </script>
    <script src="/loader-config.js"></script>
    <script src="/loader.js"></script>
  </head>

  <body>
    <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</html>
