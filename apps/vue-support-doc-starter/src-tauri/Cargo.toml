[package]
name = "mcp-manager"
version = "1.0.0"
description = "MCP Server Manager - Desktop Application"
authors = ["you"]
edition = "2021"

[lib]
name = "mcp_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
mime_guess = "2"
webbrowser = "1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
