# ===========================================
# 应用配置（vue-support-system-starter）
# ===========================================

# 系统信息
appConfig:
  title: 系统管理平台
  openAuth: false

# 站内消息
messageConfig:
  # 开启站内消息 HTTP 查询（头部铃铛 / 消息面板拉历史、未读、已读）
  query: true

# 路由：菜单完全由后端 /v2/user/menu 动态提供（本地路由仅注册 URL 兜底，不显示菜单）
routeConfig:
  mode: remote

# API 基础路径
httpConfig:
  baseUrl: /system/api
  # 重试次数（0=不重试，避免后端异常时重复请求）
  retryCount: 0
  # 401/403 鉴权失败行为：confirm=弹出确认框，redirect=直接跳转登录页
  authFailAction: confirm

# 登录页配置
loginConfig:
  captcha: false
  otp: false
  slider: false
  brandName: 系统管理
  title: 系统管理平台
  description: 系统管理平台
  beiAnHao: ""
  featureTags:
    - { icon: DataAnalysis, text: 高效管理 }
    - { icon: Brush, text: 现代设计 }
    - { icon: Lock, text: 安全可靠 }

# 其他配置
otherConfig:
  avatarFrame:
    enable: true
  # 文件服务器（独立文件存储网关，默认值与后端 plugin.filesystem.storage-server 对齐）
  filestorage:
    # 连接地址（本机默认 18080）
    server: http://127.0.0.1:18080
    # 默认存储桶（后端 provider 名）
    bucket: local
    # 存储配额（GB）：用于"存储用量"进度展示，页面 localStorage filestorage.quotaGb 可覆盖
    quotaGb: 5
  # 工具栏显隐开关（other.toolbar）
  toolbar:
    # 用户信息下拉
    user: true
    # 顶栏天气：后台 /v2/weather/overview 优先，未实现时回落三方数据源
    weather: true
    # 顶栏台风：后台 /v2/typhoon/active 优先，未实现时回落三方数据源
    typhoon: true
    # 用户下拉子项显隐（个人中心 / 锁屏 / 设置，默认全开）
    userMenu:
      personalCenter: true
      lock: true
      settings: true
  weather:
    enable: true

# 布局配置
layoutConfig:
  enable: true
  source: local

# 菜单配置
menuConfig:
  collapseSingleChild: true