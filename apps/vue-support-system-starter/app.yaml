# ===========================================
# 应用配置（vue-support-system-starter）
# ===========================================

# 系统信息
appConfig:
  title: 系统管理
  openAuth: true

# 路由：本地+远程合并
routeConfig:
  mode: all

# API 基础路径
httpConfig:
  baseUrl: /system/api

# 登录页配置：联调阶段关闭图形验证码
loginConfig:
  captcha: false
  otp: false
  slider: false