# ===========================================
# 应用配置（vue-support-system-starter）
# ===========================================

# 系统信息
appConfig:
  title: 系统管理
  openAuth: true

# 路由：本地+远程合并
routeConfig:
  mode: all

# API 基础路径
httpConfig:
  baseUrl: /system/api

# 登录页配置：联调阶段关闭图形验证码
loginConfig:
  captcha: false
  otp: false
  slider: false
  brandName: 系统管理
  welcome: 欢迎登录
  title: 系统管理
  description: 系统管理平台
  logoUrl: /assets/images/logo/logo.png
  imageUrl: /assets/images/login/science.png
  beiAnHao: ""
  featureTags:
    - { icon: DataAnalysis, text: 高效管理 }
    - { icon: Brush, text: 现代设计 }
    - { icon: Lock, text: 安全可靠 }