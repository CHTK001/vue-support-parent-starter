# ===========================================
# 应用配置（vue-support-system-starter）
# ===========================================

# 系统信息
appConfig:
  title: 系统管理平台
  openAuth: false

# 路由：本地+远程合并
routeConfig:
  mode: all

# API 基础路径
httpConfig:
  baseUrl: /system/api
  # 401/403 鉴权失败行为：confirm=弹出确认框，redirect=直接跳转登录页
  authFailAction: confirm

# 登录页配置
loginConfig:
  captcha: false
  otp: false
  slider: true
  brandName: 系统管理
  welcome: 欢迎登录
  title: 系统管理平台
  description: 系统管理平台
  logoUrl: /assets/images/logo/logo.webp
  imageUrl: /assets/images/login/science.png
  beiAnHao: ""
  featureTags:
    - { icon: DataAnalysis, text: 高效管理 }
    - { icon: Brush, text: 现代设计 }
    - { icon: Lock, text: 安全可靠 }

# 其他配置
otherConfig:
  avatarFrame:
    enable: true
  # 工具栏显隐开关（other.toolbar）
  toolbar:
    # 用户信息下拉
    user: true
    # 用户下拉子项显隐（个人中心 / 锁屏 / 设置，默认全开）
    userMenu:
      personalCenter: true
      lock: true
      settings: true

# 布局配置
layoutConfig:
  enable: true
  source: local

# 菜单配置
menuConfig:
  collapseSingleChild: true