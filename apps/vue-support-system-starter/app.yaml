# ===========================================
# vue-support-system-starter 应用配置
# 说明：remoteSettingUrl / refreshUrl 由配置模块统一管理，
#       也可用环境变量 VITE_* 覆盖（优先级最高）。
# ===========================================

# 配置中心
configConfig:
  # 系统设置接口（默认设置列表）
  remoteSettingUrl: "http://localhost:18170/system/api/v2/setting/default"

# 路由配置（三模式）
routeConfig:
  mode: remote
  remoteUrl: ""
  mergeLocalMenu: false
  modulePaths: []
  allowPrefixes: []
  whiteList:
    - /login
    - /403
    - /404
    - /500
  loginPath: /login
  homePath: /home
  notFoundPath: /404
  forbiddenPath: /403
  serverErrorPath: /500

# 系统信息
appConfig:
  title: Vue Support System
  version: "1.0.0"
  systemCode: system
  openAuth: true

# 登录页配置（登录页左侧内容，不写死；title/welcome/description 支持 i18n key 如 menu.login.title，
# 也支持字面量；featureTags.text 同理。i18n key 以 menu. 开头自动翻译）
loginConfig:
  # 图形验证码开关
  captcha: false
  # OTP 动态口令（TOTP，6 位数字）
  otp: false
  # 滑块验证（前端滑动校验）
  slider: false
  brandName: ADMIN
  logoUrl: /assets/images/logo/logo.webp
  welcome: menu.login.welcome
  title: menu.login.title
  description: menu.login.description
  imageUrl: /assets/images/login/science.png
  featureTags:
    - icon: DataAnalysis
      text: menu.login.featureTags.manage
    - icon: Brush
      text: menu.login.featureTags.design
    - icon: Lock
      text: menu.login.featureTags.security
  beiAnHao: ""

# 请求配置
httpConfig:
  baseUrl: "/system/api"
  apiVersion: ""
  enable: true
  encrypt: false
  timeout: 30000
  retryCount: 3
  retryDelay: 1000
  showLoading: true

# 缓存与存储配置
storageConfig:
  encode: true
  key: "2XNN4K8LC0ELVWN4"
  prefix: "system-"
  noPrefixKeys:
    - token
    - userInfo

# 安全配置
securityConfig:
  baiduJs:
    enable: false
    # 外部反爬脚本地址（可选，动态注入 <script> 加载）
    url: ""
    jumpUrl: ""
  dynamicFont:
    enable: false
  ocrObfuscation:
    enable: false
  # 全局水印（后端 Watermark* 设置变更后由热重载联动）
  watermark:
    enable: false
    text: "ADMIN"
    color: "#409EFF"
    alpha: 0.2
    rotate: -20

# 权限配置
permissionConfig:
  superadmin: "superadmin"
  admin: "admin"

# 令牌配置
tokenConfig:
  autoRefresh: true
  accessTokenKey: "accessToken"
  refreshTokenKey: "refreshToken"
  # token 刷新接口（/refresh-token）
  refreshUrl: "/system/api/v2/user/refresh-token"
  refreshInterval: 300000
  advanceRefresh: 60000

# 国际化配置
i18nConfig:
  defaultLocale: zh-CN
  locales:
    - zh-CN
    - en-US

# 用户布局配置
layoutConfig:
  source: local
  remoteUrl: ""

# 上传配置
uploadConfig:
  url: ""
  maxSize: 10485760
  accept:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
    - ".zip"

# 环境配置
envConfig:
  env: dev

# 系统配置
systemConfig:
  showMessage: true
  showConfig: true
  showLog: true
  showMonitor: true

# AI 配置
aiConfig:
  enable: false
  url: ""
  model: ""
  apiKey: ""

# 加密配置
crypto:
  wasmUrl: "/wasm/crypto-wasm.js"
  algorithm: "aes"

# Socket 连接配置（多协议：socketio / websocket / sse）
socketConfig:
  enable: false
  protocol: websocket
  # 服务器地址（逗号分隔，可多个；为空时回退到后端 BaseUrl/当前源）
  urls: ""
  # Socket.IO 上下文路径（协议=socketio 时生效）
  context: "/socket.io"
  # WebSocket/SSE 路径（协议=websocket/sse 时生效）
  path: "/ws"
  autoConnect: true
  reconnection: true
  reconnectionAttempts: 3
  reconnectionDelay: 1000
  heartbeatInterval: 30000
  transports:
    - websocket

# 其它配置
other:
  # 主题（default / koi）
  themeId: "koi"
  # 主题配置抽屉关闭是否二次确认（默认 false 直接关闭）
  themeConfigCloseConfirm: false
  # 框架组件显隐开关（Header 工具栏 / 布局组件）
  toolbar:
    # 搜索菜单
    searchMenu: true
    # 路由缓存刷新
    refresh: true
    # 明亮/暗黑模式切换
    dark: true
    # 语言翻译切换
    language: true
    # 全屏切换
    fullScreen: true
    # 主题配置入口
    themeSetting: true
    # 用户信息下拉
    user: true
    # 面包屑导航
    breadcrumb: true
    # 面包屑子级下拉（有子菜单时显示下拉箭头/菜单）
    breadcrumbDropdown: true
    # 面包屑显示图标
    breadcrumbIcon: true
    # 标签页（Tabs）显示图标
    tabIcon: true
    # Logo（图片 + 品牌文字）显示
    logo: true
    # 站内消息（铃铛徽标，对接后端 sysMessage + socket 推送）
    message: true
    # 工具栏默认折叠（true=折叠只显示头像，false=展开显示全部图标）
    collapse: true
  # 顶部计时器（@repo/work 定时器 Worker：多时区最多 3 个，UTC 偏移 -12 ~ +12）
  timer:
    # 是否启用顶部计时器
    enable: true
    # 展示时区（UTC 偏移小时，-12 ~ +12，最多 3 个；空数组仅显示本地时间）
    zones: []
  # 无障碍配置（读屏优化 / 高对比度 / 语音朗读）
  accessibility:
    enable: true
    screenReaderMode: false
    highContrastMode: false
    voiceReadEnabled: false
  # 开发工具配置（标尺 / 网格 / 悬停检查，仅开发/测试环境生效）
  devTools:
    enable: true
    devLiteTools: false
    devRuler: false
    devGrid: false
    devHoverInspector: false
  # 热力图配置（用户点击热点覆盖层，仅开发/测试环境生效）
  heatmap:
    enable: true
    devHeatmap: false
  # 性能监控配置（FPS / 内存 / CPU 等，实时指标悬浮）
  performance:
    enable: true
    fpsMonitorEnabled: false
    memoryMonitorEnabled: false
    cpuMonitorEnabled: false
    bandwidthMonitorEnabled: false
    batteryMonitorEnabled: false
    bluetoothMonitorEnabled: false
    screenMonitorEnabled: false
    performanceMonitorPosition: "top-right"
    performanceMonitorMode: "simple"
    performanceMonitorLayout: "merged"
    performanceMonitorDirection: "auto"
  # AI 对话配置（webllm 本地推理 / vendor 厂商 API）
  aiChat:
    enable: true
    aiChatEnabled: false
    aiChatMode: "webllm"
    aiChatModel: "Qwen2.5-1.5B-Instruct-q4f16_1-MLC"
    aiChatVendor: "openai"
    aiChatApiKey: ""
    aiChatApiUrl: ""
    aiChatMaxTokens: 512
    aiChatTemperature: 0.7
