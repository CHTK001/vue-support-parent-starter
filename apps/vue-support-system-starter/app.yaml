# ===========================================
# 应用配置（vue-support-system-starter）
# 覆盖 turbo/template/app.template.yaml 的公共模板
# ===========================================

# API 基础路径：与后端 context-path(/system/api) 一致，
# 前端所有 /v2、/v1 接口统一拼接该前缀，经 vite proxy 转发到后端
httpConfig:
  baseUrl: /system/api

# 登录页配置：联调阶段关闭图形验证码
loginConfig:
  captcha: false
  otp: false
  slider: false

# 全局异常监控（默认路径指向后端 /v2/log/report）
monitorConfig:
  enable: false
  reportUrl: /v2/log/report
