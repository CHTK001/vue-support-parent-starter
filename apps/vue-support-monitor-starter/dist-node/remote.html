<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>远程控制</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
    #display { width: 100%; height: 100%; }
    #display canvas { width: 100% !important; height: 100% !important; }
    #status { position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
              color: #fff; background: rgba(0,0,0,.7); padding: 6px 14px; border-radius: 4px;
              font: 13px monospace; z-index: 9; }
  </style>
</head>
<body>
  <div id="status">正在连接…</div>
  <div id="display"></div>
  <script type="module">
    import Guacamole from '/guacamole/guacamole-common.min.js';
    const statusEl = document.getElementById('status');
    // H2 持久化的连接状态（跨刷新保留）——key: 本次会话 hostId:protocol
    const hParam = new URLSearchParams(location.search).get('hostId') || '0';
    function loadSaved() { try { return localStorage.getItem('guac-st:' + hParam); } catch (e) { return null; } }
    function saveState(s) { try { localStorage.setItem('guac-st:' + hParam, s); } catch (e) {} }
    const saved = loadSaved();
    if (saved) statusEl.textContent = '上次状态: ' + saved + '（重连中…）';
    const params = new URLSearchParams(location.search);
    const hostId = params.get('hostId');
    const protocol = params.get('protocol') || 'ssh';
    const identityId = params.get('identityId') || '';
    const targetPort = params.get('targetPort') || '';

    const wsProto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    const wsHost = location.host;
    const wsUrl = wsProto + wsHost + '/ws/ms/server/terminal?hostId=' + hostId +
      '&protocol=' + protocol +
      (identityId ? '&identityId=' + identityId : '') +
      (targetPort ? '&targetPort=' + targetPort : '');

    console.log('[remote] connecting tunnel:', wsUrl);
    const tunnel = new Guacamole.WebSocketTunnel(wsUrl);
    const client = new Guacamole.Client(tunnel);
    const displayEl = client.getDisplay().getElement();
    displayEl.style.width = '100%';
    displayEl.style.height = '100%';
    document.getElementById('display').appendChild(displayEl);
    client.connect();

    const keyboard = new Guacamole.Keyboard(document);
    keyboard.onkeydown = (keysym) => client.sendKeyEvent(1, keysym);
    keyboard.onkeyup = (keysym) => client.sendKeyEvent(0, keysym);
    const mouse = new Guacamole.Mouse(displayEl);
    mouse.onmousedown = mouse.onmouseup = (e) => client.sendMouseState(e.state, true);
    mouse.onmousemove = (e) => client.sendMouseState(e.state, false);
    mouse.onmousewheel = (e) => client.sendMouseWheel(e.deltaY > 0 ? -1 : 1);

    // 远控工具条下发的特殊按键：Ctrl+Alt+Del / Alt+Tab / Win 等本机 OS 会截获、
    // 无法经键盘透传到被控端的组合键。先按顺序全部按下，再逆序全部松开。
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin) return;
      const d = e.data;
      if (!d || d.source !== 'sc-remote' || d.type !== 'send-special-key') return;
      const keys = Array.isArray(d.keys) ? d.keys : [];
      if (!keys.length) return;
      keys.forEach((k) => client.sendKeyEvent(1, k.keysym));
      setTimeout(() => {
        for (let i = keys.length - 1; i >= 0; i--) client.sendKeyEvent(0, keys[i].keysym);
      }, 60);
    });

    function doResize() {
      const w = window.innerWidth || document.body.clientWidth || 800;
      const h = window.innerHeight || document.body.clientHeight || 600;
      client.sendSize(w, h);
    }
    window.addEventListener('resize', doResize);
    // Multiple delayed resizes to handle layout timing
    requestAnimationFrame(() => { doResize(); setTimeout(doResize, 100); setTimeout(doResize, 300); setTimeout(doResize, 800); });

    tunnel.onstatechange = (state) => {
      if (state === Guacamole.Tunnel.State.OPEN) {
        statusEl.textContent = '已连接';
        saveState('已连接');
        setTimeout(doResize, 50);
      }
      else if (state === Guacamole.Tunnel.State.CLOSED) {
        statusEl.textContent = '已断开';
        saveState('已断开');
      }
    };
    tunnel.onerror = (status) => {
      const msg = '连接失败: ' + (status && status.message ? status.message : '未知错误');
      console.error('[remote]', msg, status);
      statusEl.textContent = msg;
      saveState(msg);
    };
  </script>
</body>
</html>
