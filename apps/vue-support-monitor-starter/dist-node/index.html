    <!-- rAF 兜底：原生 rAF 优先（可见页与刷新同步、体验不变）；页面隐藏 / 后台标签
         原生 rAF 不触发时，由 setTimeout 16ms 兜底，保证后台标签也能实时渲染与推送 -->
    <script>
      (function () {
        var nRaf = window.requestAnimationFrame
          ? window.requestAnimationFrame.bind(window)
          : null;
        var nCancel = window.cancelAnimationFrame
          ? window.cancelAnimationFrame.bind(window)
          : null;
        window.requestAnimationFrame = function (cb) {
          var fired = false;
          var nativeId = null;
          var timer = setTimeout(function () {
            if (fired) return;
            fired = true;
            cb(performance.now());
          }, 16);
          if (nRaf) {
            nativeId = nRaf(function () {
              if (fired) return;
              fired = true;
              clearTimeout(timer);
              cb(performance.now());
            });
          }
          return { timer: timer, nativeId: nativeId };
        };
        window.cancelAnimationFrame = function (handle) {
          if (!handle) return;
          clearTimeout(handle.timer);
          if (nCancel && handle.nativeId != null) nCancel(handle.nativeId);
        };
      })();
    </script>
