<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>运维管理中心 - CH Monitor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      window.process = {};
      window.agentPath = "/agent";
      window.websocketPort = "28954";
    </script>
    <script>
      // 深色主题检测
      try {
        var storage = localStorage.getItem('responsive-layout');
        if (storage) {
          var layoutConfig = JSON.parse(storage);
          if (layoutConfig.darkMode) {
            document.documentElement.classList.add('dark');
          }
        } else {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }
      } catch (e) {}
    </script>
    <script src="/loader-config.js"></script>
    <script src="/loader.js"></script>
  </head>

  <body>
    <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</html>
