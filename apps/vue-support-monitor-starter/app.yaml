# ===========================================
# 应用配置（vue-support-monitor-starter）
# ===========================================

# 系统信息
appConfig:
  title: 监控管理平台
  openAuth: false

# 路由：本地+远程合并
routeConfig:
  mode: all

# API 基础路径
httpConfig:
  baseUrl: /

# 登录页配置
loginConfig:
  captcha: false
  otp: false
  slider: true
  brandName: 监控管理
  title: 监控管理平台
  description: 监控管理平台

# 其他配置
otherConfig:
  avatarFrame:
    enable: true

# Socket 实时推送（/v2/setting/default 未下发 socket 配置时以本地为准）
# urls 为空回退 http.baseUrl/当前源 → 经 vite proxy /socket.io → 后端 netty-socketio 29181
socketConfig:
  enable: true
  protocol: socketio
  context: "/socket.io"
  transports:
    - websocket

# 布局配置（首页仪表板持久化：local=本地 localStorage / remote=远程同步）
layoutConfig:
  enable: true
  source: local
