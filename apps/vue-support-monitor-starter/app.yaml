# ===========================================
# 应用配置（vue-support-monitor-starter）
# ===========================================

# 系统信息
appConfig:
  title: 监控管理平台
  # 鉴权开关。**必须保持 true**：置 false 时 router/guard.ts 与 router/access.ts
  # 都会直接放行 —— 前端不再做任何登录态与权限判断（后端 AuthFilter 仍在，
  # 所以不是越权漏洞，但用户会看到空菜单、刷新即掉登录态）。
  # 历史上曾为了绕开「白名单路由没被消费」的守卫 bug 而置 false，
  # 该 bug 已修（guard.ts 现已实际消费 route.whiteList），无需再关。
  openAuth: true

# 路由：菜单完全来自本地路由树（src/routes.ts 的 monitorRoutes），
# 由 createVueApp 的 registerStaticMenu(buildMenuFromRoutes(...)) 注册。
#
# 不能配 all / remote：这两种模式会额外调用后端菜单接口 /v2/user/menu，
# 而本应用的后端（spring-support-monitor-starter 打的 ngx-console）没有这个接口，
# 带 token 请求返回 404「资源不存在」。菜单拉取失败会让 initDynamicRoutes 抛错，
# 进而触发强制重登把刚登录的 token 清掉 —— 表现为「登录成功后立刻被弹回登录页」。
routeConfig:
  mode: static

# API 基础路径
httpConfig:
  baseUrl: /
  # HTTP 请求超时（毫秒）。影响 http() 客户端的全部请求：超长 SQL 查询、
  # 驱动 jar 上传、导出下载等。改这里即可全局调整（缺省 10000）。
  # 长查询场景（如 select ... limit 大表）建议 ≥ 30000，否则会看到
  # axios「timeout of 10000ms exceeded」。
  timeout: 30000
  # 关掉「请求期间顶部 nprogress 进度条 + 右侧 spinner」。
  # 框架默认 showLoading: true（packages/config/src/shared.ts），每个请求都
  # start/done 一次（httpCrypto 的请求/响应拦截器），于是页面切页、筛选、刷新时
  # 顶部一直有动画在跑，视觉噪音很大；且首次进入依赖多的页面时进度条会被拉满再回跳。
  # 这里置 false 后 HTTP 不再驱动进度条，路由跳转进度条不受影响
  # （走的是 hooks.onBeforeEach/onAfterEach，与本项是两条独立通路）。
  # 需要临时给某个请求加进度条时，仍然可以 http().get(...).loading(true)。
  showLoading: false
  # 各业务模块后端前缀（createModuleHttp 读取，未配置则回退 baseUrl）。
  # device 用 device-starter 的原生前缀 /api/device——该模块未纳入 /ms/* 体系，
  # 后端由 spring-support-monitor-starter 依赖 device-starter 承载。
  moduleBaseUrl:
    device: /api/device

# 登录页配置（本地验收期间关闭滑块：自动化工具无法拖拽滑块；验收完成后还原为 true）
loginConfig:
  captcha: false
  otp: false
  slider: false
  logoUrl: /logo.svg
  brandName: 监控管理
  title: 监控管理平台
  description: 监控管理平台

# 其他配置
otherConfig:
  # 头像框字典/佩戴记录来自 system 服务的 /v2/avatar-frame/**，监控后端未实现，
  # 开着只会在每次启动留一条 404（同 hotspot 应用的处理）
  avatarFrame:
    enable: false
  toolbar:
    # 平台公告接口属 system 服务，监控后端未实现（同 collect 应用）
    announcement: false
  # 文件资产（pages/filesystem / FileStorageManage）指向的文件服务器。
  #
  # 它是**后端进程内的一个 HTTP 服务**（FileStorageServerFilter），监听在后端所在机器。
  # 前端本地跑时本机没有这个进程，所以**不在这里写死远端地址**：留空让页面回退到
  # window.location.origin（本机 8848），由 vite.config.ts 的 fileStorageTarget 代理
  # 把 /local / /localFileStorage 等前缀转发到远端文件服务器（默认 198:18080）。
  # 这样全程同源，不依赖后端 CORS 白名单，也不受本机无进程影响。
  #   需要直连别的文件服务器时：页面「服务器设置」写入 localStorage.filestorage.server，
  #   或部署侧（198 自带的 app.yaml）再显式填远端地址。
  # 桶名 = 目标文件服务的 FileStorage Bean 名，必须与 FS_API_TARGET 指向的服务一致：
  #   18080（system-api）→ local ；18082（监控内嵌）→ localFileStorage
  # 本应用（monitor）的「打开文件管理器」深度入口直开的是**监控内嵌**文件服务
  # （FileStorageServerFilter，Bean 名 localFileStorage，随节点监听在 28080 等端口），
  # 故主桶名必须是 localFileStorage。此前写死 local，点开即落到不存在的桶（实测 404），
  # service-types-live F1 用例据此断言深度入口 pathname 必须为 /localFileStorage。
  filestorage:
    bucket: localFileStorage
    quotaGb: 5

# 站内消息（顶栏铃铛）
#
# 本部署关闭 HTTP 查询。三个接口 /v2/message/sys-message/page、/unread-count、/read
# 由 spring-support-message-starter 提供，而监控后端 spring-support-monitor-starter 的
# pom 里没有这个依赖、部署的 jar 内也搜不到任何 message 相关类 —— 三个接口实测全部
# 404（S0503C0000 资源不存在）。
#
# message.query 缺省时跟随 app.openAuth（本应用是 true）自动开启，于是每次启动都在
# 控制台留三条 404 + 一条 "Failed to load resource"。置 false 后只保留 Socket 实时推送，
# 而 socketConfig.enable 已是 false，等于整块静默降级 —— 与 avatarFrame /
# toolbar.announcement 同一套口径：后端没实现的功能，前端就别发请求。
# 后端将来纳入 message-starter，把这里删掉（或改 true）即可恢复。
messageConfig:
  query: false

# Socket 实时推送（/v2/setting/default 未下发 socket 配置时以本地为准）
#
# 2026-10-14 复核后重新开启。此前误判为「198 后端没有启用 socket 服务」而关闭，
# 实测打脸：http://192.168.50.198:29612/socket.io 握手返回 200 + 合法 sid，
# socket.io 服务一直是活的（后端 --plugin.socket.room[0].port=29612）。当时的 403
# 是请求打到了 8112（API 口、有 AuthFilter），不是 29612；vite 代理 /socket.io 本就
# 正确指向 29612。socket 服务端也不校验 token（无 AuthorizationListener，连接即收）。
#
# 关闭它的真实代价：主机延迟/在线/CPU/内存/磁盘的实时推送、以及 agent 安装的进度与
# 失败原因全部收不到（后者导致安装失败了前端也看不到、弹窗卡在「准备中...」）。
#
# transports 保留 polling 打头：token 已改走 extraHeaders 消息头（见 socketio.ts），
# 而浏览器 WebSocket 握手设不了自定义头，只有 polling 的 HTTP 握手能带上 x-oauth-token；
# 连上后 socket.io 会自动升级到 websocket。若改回纯 websocket，该头不发送（服务端
# 不校验 token，连接不受影响，但头就形同虚设）。
#
# nginx 指标的实时推送与本项无关，走的是 SSE（/ms/monitor/nginx/metric/stream）。
# refreshBadge 的 REST 补偿仍然保留，与 socket 推送不冲突。
#
# 地址：不配 urls，回退 window.location.origin(=8848)，socket.io 请求经 vite /socket.io
# 代理转发到 198:29612。**不要改成直连 198:29612**：浏览器到 198:29612 是跨源请求，
# extraHeaders 里的 x-oauth-token 会触发 OPTIONS 预检（netty-socketio 不处理预检 → 连接失败），
# 且本机系统代理(127.0.0.1:7897)对 198 不 bypass。同源走 vite 代理两者都规避，token 头也干净生效。
socketConfig:
  enable: true
  protocol: socketio
  context: "/socket.io"
  # 仅 polling：经 vite 代理时 WS 升级会被 netty(SO_LINGER=0 硬关)重置、拖垮 polling 长连接，
  # 导致收不到广播。polling-only 绕开 WS 升级；且 token 走 extraHeaders 只在 polling 头发送，正好满足。
  transports:
    - polling

# 菜单配置：单子节点也渲染为可折叠子菜单（而非压平为单项）
# 置 true 才会走 el-sub-menu 的二级分组；置 false 会把只有一个子项的分组压平，
# 表现为「分组导航消失、所有条目平铺」——与本应用期望的分组导航相反。
menuConfig:
  collapseSingleChild: true

# 布局配置（首页仪表板持久化：local=本地 localStorage / remote=远程同步）
layoutConfig:
  enable: true
  source: local
