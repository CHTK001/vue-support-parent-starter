# ===========================================
# 应用配置（vue-support-monitor-starter）
# ===========================================

# 系统信息
appConfig:
  title: 监控管理平台
  openAuth: false

# 路由：本地+远程合并
routeConfig:
  mode: all

# API 基础路径
httpConfig:
  baseUrl: /

# 登录页配置
loginConfig:
  captcha: false
  otp: false
  slider: true
  logoUrl: /logo.svg
  brandName: 监控管理
  title: 监控管理平台
  description: 监控管理平台

# 其他配置
otherConfig:
  # 头像框字典/佩戴记录来自 system 服务的 /v2/avatar-frame/**，监控后端未实现，
  # 开着只会在每次启动留一条 404（同 hotspot 应用的处理）
  avatarFrame:
    enable: false
  toolbar:
    # 平台公告接口属 system 服务，监控后端未实现（同 collect 应用）
    announcement: false
  # 文件资产（pages/filesystem / FileStorageManage）指向的独立文件服务器：
  # 由「服务管理」的文件服务器节点（file-storage 插件，端口 18082）提供，
  # 桶名 = FileStorage Bean 名（localFileStorage），与监控文件资产网关同源
  filestorage:
    server: http://127.0.0.1:18082
    bucket: localFileStorage
    quotaGb: 5

# Socket 实时推送（/v2/setting/default 未下发 socket 配置时以本地为准）
# urls 为空回退 http.baseUrl/当前源 → 经 vite proxy /socket.io → 后端 netty-socketio 29181
socketConfig:
  enable: true
  protocol: socketio
  context: "/socket.io"
  transports:
    - websocket

# 菜单配置：单子节点也渲染为可折叠子菜单（而非压平为单项）
menuConfig:
  collapseSingleChild: false

# 布局配置（首页仪表板持久化：local=本地 localStorage / remote=远程同步）
layoutConfig:
  enable: true
  source: local
