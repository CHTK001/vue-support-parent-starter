# ===========================================
# 应用配置（vue-support-monitor-starter）
# ===========================================

# 系统信息
appConfig:
  title: 监控管理平台
  # 验收完成后必须调回 true（本文件必须保持 true）
  openAuth:
    enable: true

# 路由：菜单完全来自本地路由树（src/routes.ts 的 monitorRoutes），
# 由 createVueApp 的 registerStaticMenu(buildMenuFromRoutes(...)) 注册。
#
# 不能配 all / remote：这两种模式会额外调用后端菜单接口 /v2/user/menu，
# 而本应用的后端（spring-support-monitor-starter 打的 ngx-console）没有这个接口，
# 带 token 请求返回 404「资源不存在」。菜单拉取失败会让 initDynamicRoutes 抛错，
# 进而触发强制重登把刚登录的 token 清掉 —— 表现为「登录成功后立刻被弹回登录页」。
routeConfig:
  mode: static

# API 基础路径
httpConfig:
  baseUrl: /
  # HTTP 请求超时（毫秒）。影响 http() 客户端的全部请求：超长 SQL 查询、
  # 驱动 jar 上传、导出下载等。改这里即可全局调整（缺省 10000）。
  # 长查询场景（如 select ... limit 大表）建议 ≥ 30000，否则会看到
  # axios「timeout of 10000ms exceeded」。
  timeout: 30000
  # 请求不驱动顶部 nprogress 进度条（框架缺省已是 false，这里显式写一遍防止回退）。
  # 每个请求都 start/done 会让切页、筛选、刷新时顶部一直有动画在跑，
  # 首次进入依赖多的页面还会被拉满再回跳，视觉噪音很大。
  # 顶栏只服务「切换菜单 / 打开页面」的路由跳转（createApp 的 guard hooks），与本项无关。
  # 需要临时给某个请求加进度条时，仍然可以 http().get(...).loading(true)。
  showLoading: false
  # 各业务模块后端前缀（createModuleHttp 读取，未配置则回退 baseUrl）。
  # device 用 device-starter 的原生前缀 /api/device——该模块未纳入 /ms/* 体系，
  # 后端由 spring-support-monitor-starter 依赖 device-starter 承载。
  # template 用 template-starter 的前缀 /api/template——模板后端由 message/eduai（192.168.50.198:18170）
  # 承载，不在 monitor 后端进程内；dev 下追加了 /api/template 代理，
  # 把请求交给 template 默认的 TEMPLATE_API_TARGET（局域网 18170 端点）——
  # 可被 TEMPLATE_API_TARGET 覆盖。
  moduleBaseUrl:
    device: /api/device
    template: /api/template

# 登录页配置（本地验收期间关闭滑块：自动化工具无法拖拽滑块；验收完成后还原为 true）
loginConfig:
  # 登录类型：数组顺序即登录页卡片顺序；只配一项时登录页不显示切换器。
  # 每项可带自己的 baseUrl（指向租户独立站点）；留空 = 同源，走 vite/nginx 代理。
  #   type       类型标识（日志/埋点用，自定义）
  #   title      卡片标题            description 卡片描述
  #   icon       Element Plus 图标名（User / OfficeBuilding / Monitor / Setting / Grid）
  #   baseUrl    该入口的后端地址，留空沿用 httpConfig.baseUrl
  #   tenantCode 是否手填租户编码（地址已能确定租户时保持不写）
  #
  # 需要「平台 + 租户两个入口」时改成两项，例如：
  #   - { type: web,    title: 普通登录, description: 使用平台账号登录, icon: User }
  #   - { type: tenant, title: 租户登录, description: 使用租户账号登录, icon: OfficeBuilding,
  #       baseUrl: https://tenant.example.com }
  types:
    - type: web
      title: 普通登录
      description: 使用平台账号登录
      icon: User
  captcha: false
  otp: false
  slider: false
  logoUrl: /logo.svg
  brandName: 监控管理
  title: 监控管理平台
  description: 监控管理平台

# 其他配置
otherConfig:
  # 头像框字典/佩戴记录来自 system 服务的 /v2/avatar-frame/**，监控后端未实现，
  # 开着只会在每次启动留一条 404（同 hotspot 应用的处理）
  avatarFrame:
    enable: false
  # 壁纸：内置渐变/图案是纯 CSS，但主题 store 挂载时仍会拉 /v2/wallpaper/list
  # 同步服务端目录；监控后端没有该接口，每次启动都会留一条 404。
  # 本部署先关闭（个人中心不出现壁纸页签）；后端补上 wallpaper 接口后再打开。
  wallpaper:
    enable: false
  toolbar:
    # 平台公告接口属 system 服务，监控后端未实现（同 collect 应用）
    announcement:
      enable: false
  # 文件资产（pages/filesystem / FileStorageManage）指向的文件服务器。
  #
  # 它是**后端进程内的一个 HTTP 服务**（FileStorageServerFilter），监听在后端所在机器。
  # 前端本地跑时本机没有这个进程，所以**不在这里写死远端地址**：留空让页面回退到
  # window.location.origin（本机 8848），由 vite.config.ts 的 fileStorageTarget 代理
  # 把 /local / /localFileStorage 等前缀转发到远端文件服务器（默认 198:18080）。
  # 这样全程同源，不依赖后端 CORS 白名单，也不受本机无进程影响。
  #   需要直连别的文件服务器时：页面「服务器设置」写入 localStorage.filestorage.server，
  #   或部署侧（198 自带的 app.yaml）再显式填远端地址。
  # 桶名 = 目标文件服务的 FileStorage Bean 名，必须与 FS_API_TARGET 指向的服务一致：
  #   18080（system-api）→ local ；18082（监控内嵌）→ localFileStorage
  # 本应用（monitor）的「打开文件管理器」深度入口直开的是**监控内嵌**文件服务
  # （FileStorageServerFilter，Bean 名 localFileStorage，随节点监听在 28080 等端口），
  # 故主桶名必须是 localFileStorage。此前写死 local，点开即落到不存在的桶（实测 404），
  # service-types-live F1 用例据此断言深度入口 pathname 必须为 /localFileStorage。
  filestorage:
    bucket: localFileStorage
    quotaGb: 5

# 站内消息（顶栏铃铛）
#
# 本部署关闭 HTTP 查询。三个接口 /v2/message/sys-message/page、/unread-count、/read
# 由 spring-support-message-starter 提供，而监控后端 spring-support-monitor-starter 的
# pom 里没有这个依赖、部署的 jar 内也搜不到任何 message 相关类 —— 三个接口实测全部
# 404（S0503C0000 资源不存在）。
#
# message.query 缺省时跟随 app.openAuth（本应用是 true）自动开启，于是每次启动都在
# 控制台留三条 404 + 一条 "Failed to load resource"。置 false 后只保留 Socket 实时推送，
# 而 socketConfig.enable 已是 false，等于整块静默降级 —— 与 avatarFrame /
# toolbar.announcement 同一套口径：后端没实现的功能，前端就别发请求。
# 后端将来纳入 message-starter，把这里删掉（或改 true）即可恢复。
messageConfig:
  query:
    enable: false

# Socket 实时推送（/v2/setting/default 未下发 socket 配置时以本地为准）
#
# 【当前状态：已关闭】2026-11-02 在本 instabox sandbox 实例上实测确认：
#   1) socket 推送端口（<api-host> 的 29612）已发布但沙箱内无进程监听
#      （返回 "Nothing is listening on this port in the sandbox"）；
#   2) API 端口本身**完全没有 socket.io 端点** —— /socket.io、/ms/socket.io、
#      /v2/socket.io、/socket、/ws/socket.io、/socket.io/socket.io.js 六条路径
#      带 token 全部 404（S0503C0000 资源不存在），匿名访问则被 AuthFilter 拦成 403。
# 结论：该实例未启动 plugin.socket.room，实时推送在此环境下**无法连通**。
# 开启时 vite /socket.io 每次转发必得 502，页面侧表现为持续重连噪音，
# 故关闭。关闭后 initGlobalSocket 直接短路（packages/core/src/createApp.ts:273），
# 不再发起任何连接。
#
# 关闭的真实代价（已知并接受）：主机延迟/在线/CPU/内存/磁盘的实时推送、以及 agent
# 安装的进度与失败原因收不到。发布日志与任务进度已由 pollLogTail 轮询快照兜底
# （源码本就有该路径，见 pages/server/src/views/release/ProjectsView.vue:2773）。
#
# 【如何恢复】两条都要满足：
#   1) 后端启动参数补上 --plugin.socket.room[0].port=29612，使该端口真正监听；
#   2) 把本处 enable 改回 true。
# 部署环境若 socket 为常态可用，应保持 true；此处关闭仅针对当前实例。
#
# transports 保留 polling 打头：token 已改走 extraHeaders 消息头（见 socketio.ts），
# 而浏览器 WebSocket 握手设不了自定义头，只有 polling 的 HTTP 握手能带上 x-oauth-token；
# 连上后 socket.io 会自动升级到 websocket。若改回纯 websocket，该头不发送（服务端
# 不校验 token，连接不受影响，但头就形同虚设）。
#
# nginx 指标的实时推送与本项无关，走的是 SSE（/ms/monitor/nginx/metric/stream）。
# refreshBadge 的 REST 补偿仍然保留，与 socket 推送不冲突。
#
# 地址：不配 urls，回退 window.location.origin(=8848)，socket.io 请求经 vite /socket.io
# 代理转发到 <api-host>:29612。**不要改成直连远端 29612**：浏览器到它是跨源请求，
# extraHeaders 里的 x-oauth-token 会触发 OPTIONS 预检（netty-socketio 不处理预检 → 连接失败），
# 且本机系统代理(127.0.0.1:7897)对局域网地址不 bypass。同源走 vite 代理两者都规避，
# token 头也干净生效。
socketConfig:
  # 验收后端已启用 plugin.socket.room（18086 使用 29624），恢复实时推送；
  # dev 代理需同步设置 MS_SOCKET_TARGET 指向该端口。
  enable: true
  protocol: socketio
  context: "/socket.io"
  # 仅 polling：经 vite 代理时 WS 升级会被 netty(SO_LINGER=0 硬关)重置、拖垮 polling 长连接，
  # 导致收不到广播。polling-only 绕开 WS 升级；且 token 走 extraHeaders 只在 polling 头发送，正好满足。
  transports:
    - polling

# APM 观测（pages/apm）
#
# 「是否装了 APM」由后端 /api/apm/v1/status 探测，本配置只管前端表现：
#   enable=false → 菜单里不出现 APM 分组（路由仍可直达，方便临时排查）
#   engine       → 预期引擎（skywalking / opentelemetry / hotspot），留空不校验；
#                  与探测结果不一致时页面顶部会提示，不会改数据源
#   baseUrl      → 必须与后端 plugin.apm.path 一致（默认 /api/apm/v1）
#   statusTtl    → 状态探测缓存毫秒数，多页面同时挂载时靠它合并请求
apmConfig:
  enable: true
  engine: ""
  baseUrl: /api/apm/v1
  statusTtl: 15000

# 菜单配置：单子节点也渲染为可折叠子菜单（而非压平为单项）
# 置 true 才会走 el-sub-menu 的二级分组；置 false 会把只有一个子项的分组压平，
# 表现为「分组导航消失、所有条目平铺」——与本应用期望的分组导航相反。
menuConfig:
  collapseSingleChild:
    enable: true

# 布局配置（首页仪表板持久化：local=本地 localStorage / remote=远程同步）
layoutConfig:
  enable: true
  source: local
