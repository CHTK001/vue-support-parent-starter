# ===========================================
# 应用配置（vue-support-monitor-starter）
# ===========================================

# 系统信息
appConfig:
  title: 监控管理平台
  openAuth: false

# 路由：本地+远程合并
routeConfig:
  mode: all

# API 基础路径
httpConfig:
  baseUrl: /

# 登录页配置
loginConfig:
  captcha: false
  otp: false
  slider: true
  brandName: 监控管理
  welcome: 欢迎登录
  title: 监控管理平台
  description: 监控管理平台
  imageUrl: /assets/images/login/science.png

# 其他配置
otherConfig:
  avatarFrame:
    enable: true

# 布局配置（首页仪表板持久化：local=本地 localStorage / remote=远程同步）
layoutConfig:
  enable: true
  source: local
