# ===========================================
# 应用配置（vue-support-monitor-starter）
# ===========================================

# 系统信息
appConfig:
  title: 监控管理平台
  openAuth: false

# 路由：菜单完全来自本地路由树（src/routes.ts 的 monitorRoutes），
# 由 createVueApp 的 registerStaticMenu(buildMenuFromRoutes(...)) 注册。
#
# 不能配 all / remote：这两种模式会额外调用后端菜单接口 /v2/user/menu，
# 而本应用的后端（spring-support-monitor-starter 打的 ngx-console）没有这个接口，
# 带 token 请求返回 404「资源不存在」。菜单拉取失败会让 initDynamicRoutes 抛错，
# 进而触发强制重登把刚登录的 token 清掉 —— 表现为「登录成功后立刻被弹回登录页」。
routeConfig:
  mode: static

# API 基础路径
httpConfig:
  baseUrl: /

# 登录页配置（本地验收期间关闭滑块：自动化工具无法拖拽滑块；验收完成后还原为 true）
loginConfig:
  captcha: false
  otp: false
  slider: false
  logoUrl: /logo.svg
  brandName: 监控管理
  title: 监控管理平台
  description: 监控管理平台

# 其他配置
otherConfig:
  # 头像框字典/佩戴记录来自 system 服务的 /v2/avatar-frame/**，监控后端未实现，
  # 开着只会在每次启动留一条 404（同 hotspot 应用的处理）
  avatarFrame:
    enable: false
  toolbar:
    # 平台公告接口属 system 服务，监控后端未实现（同 collect 应用）
    announcement: false
  # 文件资产（pages/filesystem / FileStorageManage）指向的独立文件服务器：
  # 由「服务管理」的文件服务器节点（file-storage 插件，端口 18082）提供，
  # 桶名 = FileStorage Bean 名（localFileStorage），与监控文件资产网关同源
  filestorage:
    server: http://127.0.0.1:18082
    bucket: localFileStorage
    quotaGb: 5

# Socket 实时推送（/v2/setting/default 未下发 socket 配置时以本地为准）
#
# 本部署关闭：192.168.50.198 的后端没有启用 socket 服务，
# 每次握手都被拒（403）。这不是「少了个角标」的问题——vite 把 /socket.io 代理成 ws 后，
# 每次失败的握手都会在 vite 侧抛一次 `ws proxy socket error: write ECONNABORTED`，
# 异常持续累积直到把 dev server 进程带崩（实测一轮验收里刷出 117 次重连后前端就取不到数据了）。
# createApp.initGlobalSocket 在 enable=false 时会调 closeGlobalSocketService() 主动断开，
# 不是「不创建而已」，所以关得干净。
#
# nginx 指标的实时推送与本项无关，走的是 SSE（/ms/monitor/nginx/metric/stream）。
# 后端将来启用了 socket 服务，把这里改回 true 即可恢复告警徽标的实时性；
# 届时 refreshBadge 的 REST 补偿仍然保留，两者不冲突。
socketConfig:
  enable: false
  protocol: socketio
  context: "/socket.io"
  transports:
    - websocket

# 菜单配置：单子节点也渲染为可折叠子菜单（而非压平为单项）
# 置 true 才会走 el-sub-menu 的二级分组；置 false 会把只有一个子项的分组压平，
# 表现为「分组导航消失、所有条目平铺」——与本应用期望的分组导航相反。
menuConfig:
  collapseSingleChild: true

# 布局配置（首页仪表板持久化：local=本地 localStorage / remote=远程同步）
layoutConfig:
  enable: true
  source: local
