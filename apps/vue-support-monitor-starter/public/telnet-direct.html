<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Telnet 直连终端</title>
  <link rel="stylesheet" href="/term/xterm.css">
  <style>
    html, body { margin: 0; height: 100%;
                 /* 底色跟随终端配色（--term-bg 由 JS 设置），#111 只是兜底 */
                 background: var(--term-bg, #111); overflow: hidden; }
    #term { width: 100%; height: 100%; padding: 4px 0 0 6px; box-sizing: border-box; }
    /* 滚动条：与 ssh-direct.html 保持同一套细条口径（颜色跟随终端文字色） */
    .xterm .xterm-viewport { scrollbar-width: thin; scrollbar-color: transparent transparent; }
    .xterm:hover .xterm-viewport {
      scrollbar-color: color-mix(in srgb, var(--term-fg, #e6e6e6) 30%, transparent) transparent;
    }
    .xterm .xterm-viewport::-webkit-scrollbar { width: 6px; height: 6px; }
    .xterm .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
    .xterm .xterm-viewport::-webkit-scrollbar-thumb {
      background-color: transparent;
      border-radius: 4px;
    }
    .xterm:hover .xterm-viewport::-webkit-scrollbar-thumb {
      background-color: color-mix(in srgb, var(--term-fg, #e6e6e6) 30%, transparent);
    }
    .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
      background-color: color-mix(in srgb, var(--term-fg, #e6e6e6) 55%, transparent);
    }
    #status { position: fixed; top: 8px; right: 14px;
              /* 跟随配色：浅色主题下仍是深色胶囊就成了「主题没生效」的样子 */
              color: var(--term-fg, #eee);
              background: color-mix(in srgb, var(--term-bg, #111) 72%, transparent);
              border: 1px solid color-mix(in srgb, var(--term-fg, #eee) 18%, transparent);
              padding: 5px 12px; border-radius: 4px;
              font: 12px/1.4 monospace; z-index: 11; pointer-events: none; }
    /* 终端内搜索条：Ctrl+F 打开，浮在右上角状态胶囊下方 */
    #find { position: fixed; top: 40px; right: 14px; z-index: 12;
            display: flex; align-items: center; gap: 6px;
            padding: 6px 8px; border-radius: 6px;
            background: color-mix(in srgb, var(--term-bg, #111) 90%, transparent);
            border: 1px solid color-mix(in srgb, var(--term-fg, #eee) 22%, transparent);
            color: var(--term-fg, #eee); font: 12px/1.4 monospace; }
    #find.hide { display: none; }
    #find input { width: 190px; padding: 3px 6px; border-radius: 4px;
                  border: 1px solid color-mix(in srgb, var(--term-fg, #eee) 25%, transparent);
                  background: transparent; color: inherit; font: inherit; outline: none; }
    #find input:focus { border-color: var(--term-accent, #6aa1ff); }
    #find button { min-width: 22px; height: 22px; padding: 0 4px; cursor: pointer;
                   border: 1px solid transparent; border-radius: 4px;
                   background: transparent; color: inherit; font: inherit; }
    #find button:hover { background: color-mix(in srgb, var(--term-fg, #eee) 14%, transparent); }
    #find-count { min-width: 44px; text-align: center; opacity: .75; }
    /* 窄屏：固定 right + 固定输入宽度会把三个按钮挤出屏幕，改成整行铺开 */
    @media (max-width: 420px) {
      #find { left: 8px; right: 8px; top: 34px; }
      #find input { flex: 1 1 auto; width: auto; min-width: 0; }
    }
    #loading { position: fixed; inset: 0; z-index: 10; display: flex;
               flex-direction: column; align-items: center; justify-content: center; gap: 14px;
               background: var(--term-bg, #111); transition: opacity .25s ease; }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .lbl { color: var(--term-fg, #cfd3da); opacity: .85;
                    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
                    letter-spacing: .3px; text-align: center; }
    #loading .sub { color: var(--term-fg, #6b7280); opacity: .5; font: 11px/1.4 monospace; }
    #loading .err { color: #ff7a7a; max-width: 70%; opacity: 1; }
    .spinner { width: 38px; height: 38px; border-radius: 50%;
               border: 3px solid rgba(128,128,128,.28);
               border-top-color: var(--term-accent, #6aa1ff);
               animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    /* 配色必须在首帧之前就生效：这段放在 head 里同步执行，否则页面会先按兜底
       深色画一帧再被脚本改掉（浅色主题下就是明显的一下闪黑）。算出来的对象挂到
       window.termTheme，body 里的脚本复用同一份，不再重复解码。 */
    (function () {
      var DEFAULT_THEME = {
        background: '#111111', foreground: '#e6e6e6',
        cursor: '#e6e6e6', cursorAccent: '#111111', selectionBackground: '#264f78',
        black: '#000000', red: '#cd3131', green: '#0dbc79', yellow: '#e5e510',
        blue: '#2472c8', magenta: '#bc3fbc', cyan: '#11a8cd', white: '#e5e5e5',
        brightBlack: '#666666', brightRed: '#f14c4c', brightGreen: '#23d18b',
        brightYellow: '#f5f543', brightBlue: '#3b8eea', brightMagenta: '#d670d6',
        brightCyan: '#29b8db', brightWhite: '#ffffff'
      };

      /** 解 URL-safe base64（无填充）里的 JSON；任何异常都返回 null，走默认配色 */
      function decodeTheme(raw) {
        if (!raw) return null;
        try {
          var b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4) b64 += '=';
          var bin = atob(b64);
          var json = '';
          for (var i = 0; i < bin.length; i++) {
            json += '%' + ('00' + bin.charCodeAt(i).toString(16)).slice(-2);
          }
          var obj = JSON.parse(decodeURIComponent(json));
          return obj && typeof obj === 'object' ? obj : null;
        } catch (e) {
          return null;
        }
      }

      /** 页面底色、遮罩与状态胶囊的配色变量 */
      function applyThemeChrome(t) {
        var root = document.documentElement.style;
        root.setProperty('--term-bg', t.background || '#111111');
        root.setProperty('--term-fg', t.foreground || '#e6e6e6');
        root.setProperty('--term-accent', t.cursor || t.foreground || '#6aa1ff');
      }

      var raw = new URLSearchParams(location.search).get('theme');
      var theme = Object.assign({}, DEFAULT_THEME, decodeTheme(raw) || {});
      applyThemeChrome(theme);
      window.termTheme = { DEFAULT: DEFAULT_THEME, apply: applyThemeChrome, initial: theme };
    })();
  </script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="lbl" id="loading-lbl">正在建立 Telnet 连接…</div>
    <div class="sub" id="loading-sub"></div>
  </div>
  <div id="status">正在连接…</div>
  <div id="find" class="hide">
    <input id="find-input" type="text" placeholder="在回滚缓冲里搜索" spellcheck="false" />
    <span id="find-count"></span>
    <button id="find-prev" type="button" title="上一个（Shift+Enter）">↑</button>
    <button id="find-next" type="button" title="下一个（Enter）">↓</button>
    <button id="find-close" type="button" title="关闭（Esc）">×</button>
  </div>
  <div id="term"></div>
  <script src="/term/xterm.js"></script>
  <script src="/term/addon-fit.js"></script>
  <script>
    (function () {
      var statusEl = document.getElementById('status');
      var params = new URLSearchParams(location.search);
      var hostId = params.get('hostId') || '';
      /* 目标端口可由外层显式指定；缺省时后端按主机台账 / 配置的 Telnet 端口解析 */
      var targetPort = params.get('targetPort') || '';

      /* ===== 终端配色 =====
         默认值、theme 参数解码与首次着色都在 <head> 的内联脚本里做完了（必须早于
         首帧，否则浅色主题会先闪一下兜底深色）；这里只取回同一份对象。
         运行期热更新仍走 postMessage({ type: 'TERMINAL_THEME', theme })。 */
      var DEFAULT_THEME = window.termTheme.DEFAULT;
      var applyThemeChrome = window.termTheme.apply;
      var theme = window.termTheme.initial;

      var term = new Terminal({
        cursorBlink: true,
        fontFamily: 'Consolas, Menlo, "Courier New", monospace',
        fontSize: 13,
        scrollback: 8000,
        theme: theme
      });
      var fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById('term'));
      fit.fit();

      /* ===== 终端内搜索（Ctrl+F） =====
         public/term 下只有 xterm.js 与 addon-fit.js，没有 search addon，
         所以这里直接在回滚缓冲里按行找子串：Enter 下一个、Shift+Enter 上一个、
         Esc 关闭；命中后把那一行滚进视野，并用 term.select 选中关键字。 */
      var findEl = document.getElementById('find');
      var findInput = document.getElementById('find-input');
      var findCount = document.getElementById('find-count');
      var findHits = [];
      var findIndex = -1;

      /**
       * 按行扫回滚缓冲收集命中（同一行多处命中都算）。
       *
       * <p>返回的 col/len 是**单元格列**，不是字符串下标：{@code translateToString}
       * 对宽字符每两个单元格只产出一个字符，emoji 还可能占两个 UTF-16 码元，直接拿
       * indexOf 的结果去 select，中文行的选区会偏左、长度偏短。</p>
       */
      function collectHits(needle) {
        var hits = [];
        var lower = needle.toLowerCase();
        var buf = term.buffer.active;
        for (var y = 0; y < buf.length; y++) {
          var line = buf.getLine(y);
          if (!line) continue;
          var text = line.translateToString(true);
          if (!text) continue;
          var lowerText = text.toLowerCase();
          /* 大小写转换可能改变长度（土耳其 İ、德语 ß）：那种情况下标与 cellAt
             对不上，退化成区分大小写搜索，保证选区位置仍准确 */
          var sameLen = lowerText.length === text.length;
          var haystack = sameLen ? lowerText : text;
          var needleText = sameLen ? lower : needle;
          var from = haystack.indexOf(needleText);
          if (from < 0) continue;
          /* 只为确实有命中的行建「字符串下标 → 单元格列」映射，没命中的行不多走一遍 */
          var cellAt = [];
          var strIdx = 0;
          for (var x = 0; x < line.length; x++) {
            var cell = line.getCell(x);
            var chars = cell ? cell.getChars() : '';
            if (!chars) continue;                 /* 宽字符尾部占位格没有字符 */
            for (var k = 0; k < chars.length; k++) cellAt[strIdx + k] = x;
            strIdx += chars.length;
          }
          while (from >= 0) {
            var head = cellAt[from];
            var tail = cellAt[from + needleText.length - 1];
            if (head === undefined) { from = haystack.indexOf(needleText, from + 1); continue; }
            if (tail === undefined) tail = head;
            hits.push({ row: y, col: head, len: tail - head + 1 });
            from = haystack.indexOf(needleText, from + needleText.length);
          }
        }
        return hits;
      }

      /** 把当前命中滚进视野并选中 */
      function showHit() {
        if (!findHits.length) { findCount.textContent = '0/0'; return; }
        var hit = findHits[findIndex];
        findCount.textContent = (findIndex + 1) + '/' + findHits.length;
        try {
          term.scrollToLine(hit.row);
          var top = term.buffer.active.viewportY;
          term.select(hit.col, Math.max(0, hit.row - top), hit.len);
        } catch (err) {
          /* 老版本 xterm 没有 select：滚到位置也算达成 */
        }
      }

      /** 往前/后走一格命中（循环） */
      function findStep(delta) {
        var needle = findInput.value;
        if (!needle) { findHits = []; findIndex = -1; findCount.textContent = ''; return; }
        findHits = collectHits(needle);
        if (!findHits.length) { findIndex = -1; findCount.textContent = '0/0'; return; }
        if (findIndex < 0 || findIndex >= findHits.length) {
          findIndex = delta > 0 ? 0 : findHits.length - 1;
        } else {
          findIndex = (findIndex + delta + findHits.length) % findHits.length;
        }
        showHit();
      }

      function openFind() {
        findEl.classList.remove('hide');
        findHits = [];
        findIndex = -1;
        findCount.textContent = '';
        findInput.focus();
        findInput.select();
        if (findInput.value) findStep(1);
      }

      function closeFind() {
        findEl.classList.add('hide');
        findHits = [];
        findIndex = -1;
        findCount.textContent = '';
        /* 关键词留着：再按 Ctrl+F 直接回车就能接着找，和浏览器查找一致 */
        term.focus();
      }

      findInput.addEventListener('input', function () { findIndex = -1; });
      findInput.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { e.preventDefault(); closeFind(); return; }
        if (e.key === 'Enter') { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); }
      });
      document.getElementById('find-prev').addEventListener('click', function () { findStep(-1); });
      document.getElementById('find-next').addEventListener('click', function () { findStep(1); });
      document.getElementById('find-close').addEventListener('click', function () { closeFind(); });

      /* Ctrl+F / Cmd+F 归页面所有，不再把 ^F 发给远端 */
      term.attachCustomKeyEventHandler(function (e) {
        if (e.type !== 'keydown' || e.altKey) return true;
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'f' || e.key === 'F')) {
          openFind();
          return false;
        }
        return true;
      });

      /* 焦点不在终端里时按 Ctrl+F：浏览器会弹自己的查找框，而它搜的是 DOM，
         终端内容一个字都搜不到。捕获阶段先接管；终端内部交给 xterm 的 key handler。 */
      document.addEventListener('keydown', function (e) {
        if (e.altKey || e.shiftKey) return;
        if (!(e.ctrlKey || e.metaKey) || (e.key !== 'f' && e.key !== 'F')) return;
        var host = document.getElementById('term');
        if (host && e.target && host.contains(e.target)) return;
        e.preventDefault();
        openFind();
      }, true);

      var wsProto = location.protocol === 'https:' ? 'wss://' : 'ws://';
      var wsUrl = wsProto + location.host + '/ws/ms/server/terminal/telnet?hostId=' + encodeURIComponent(hostId)
        + '&cols=' + term.cols + '&rows=' + term.rows
        + (targetPort ? '&targetPort=' + encodeURIComponent(targetPort) : '')
        + (params.get('x-oauth-token') ? '&x-oauth-token=' + encodeURIComponent(params.get('x-oauth-token')) : '');
      var ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';
      var encoder = new TextEncoder();

      term.onData(function (data) {
        if (ws.readyState === WebSocket.OPEN) ws.send(encoder.encode(data));
      });
      term.onResize(function (size) {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ c: 'resize', cols: size.cols, rows: size.rows }));
        }
      });

      /* 外层工具条下发一行命令：直接写进终端输入口，等价于用户键入后回车。
         多行命令统一成 \r 逐行回车，不能留裸 \n：服务端只把回车当提交，
         裸 \n 会让几行命令粘成一行。 */
      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.type !== 'TERMINAL_INPUT' || typeof d.command !== 'string') return;
        var text = d.command.replace(/\r?\n/g, '\r') + '\r';
        if (ws.readyState === WebSocket.OPEN) ws.send(encoder.encode(text));
      });

      /* 运行期热更新配色：设置面板边调边发，无需重开终端 */
      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.type !== 'TERMINAL_THEME' || !d.theme) return;
        theme = Object.assign({}, DEFAULT_THEME, d.theme);
        applyThemeChrome(theme);
        try {
          term.options.theme = theme;
        } catch (err) {
          /* 老版本 xterm 没有 options 设置器，只能等下次打开生效 */
        }
        try { fit.fit(); } catch (err2) { /* 忽略 */ }
      });

      var loadingEl = document.getElementById('loading');
      var loadingLbl = document.getElementById('loading-lbl');
      var loadingSub = document.getElementById('loading-sub');
      loadingSub.textContent = 'hostId=' + hostId + (targetPort ? (' port=' + targetPort) : '');
      function hideLoading() { loadingEl.classList.add('hide'); }
      function loadingError(msg) {
        var sp = loadingEl.querySelector('.spinner');
        if (sp) sp.style.display = 'none';
        loadingLbl.classList.add('err');
        loadingLbl.textContent = msg;
        loadingEl.classList.remove('hide');
      }

      ws.onopen = function () {
        statusEl.textContent = '已连接（Telnet 直连）';
        hideLoading();
        term.focus();
      };
      var errored = false;
      ws.onmessage = function (event) {
        if (typeof event.data === 'string') {
          /* 拒绝连接时后端回 {"code":50001,"msg":"..."}，其它文本控制帧忽略 */
          var cmd = null;
          try { cmd = JSON.parse(event.data); } catch (e) { cmd = null; }
          var msg = cmd && cmd.msg ? cmd.msg : event.data;
          errored = true;
          statusEl.textContent = msg;
          loadingError(msg);
          term.writeln('\r\n\x1b[31m' + msg + '\x1b[0m');
          return;
        }
        term.write(new Uint8Array(event.data));
      };
      ws.onclose = function () {
        if (!errored) {
          statusEl.textContent = '已断开';
          loadingError('连接已关闭，请刷新页面重新连接');
          term.writeln('\r\n\x1b[33m连接已关闭\x1b[0m');
        }
      };
      ws.onerror = function () {
        if (!errored) {
          statusEl.textContent = '连接异常';
        }
      };

      function doFit() {
        try { fit.fit(); } catch (e) { return; }
        term.focus();
      }
      window.addEventListener('resize', doFit);
      setTimeout(doFit, 100);
      setTimeout(doFit, 600);
      setInterval(function () {
        if (ws.readyState === WebSocket.OPEN) { try { fit.fit(); } catch (e) { /* 忽略 */ } }
      }, 2000);
    })();
  </script>
</body>
</html>
