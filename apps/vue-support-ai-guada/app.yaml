# ===========================================
# 应用配置（vue-support-ai-guada —— AI 控制台）
# ===========================================

# 系统信息
appConfig:
  title: AI 控制台
  systemCode: ai-guada
  # 登录守卫由本应用路由自行实现（见 src/router 守卫），不启用框架远程菜单鉴权
  openAuth: false
  # 品牌 Logo / favicon 统一由 getConfig('app') 提供，组件与 index.html 不再硬编码
  logoUrl: /images/guada_logo_small.png
  logoLargeUrl: /images/guada_logo.png
  favicon: /images/guada_logo.png

# 路由：静态路由由 main.js 自行创建，不使用框架远程菜单
routeConfig:
  mode: static
  whiteList:
    - /login
    - /password

# API 基础路径：框架接口地址（urlConfig.*）自带 /v2 前缀，这里必须留空避免二次拼接；
# AI 业务客户端的 /v2 前缀由 src/framework/context.ts 显式携带（经 vite proxy → 8787）。
httpConfig:
  baseUrl: ""
  timeout: 30000
  showLoading: false
  encrypt: false
  sign: false
  # 本应用各页面已自行展示后端 msg（ElMessage / toast），关闭框架重复提示；
  # 拦截器仍负责 401/403 跳登录与业务失败 reject。
  toast:
    enable: false

# 远程配置中心（/v2/setting/default 由 system 后端提供，AI 后端未实现）关闭拉取
configConfig:
  enable: false

# 令牌：accessToken 由框架 storage 统一读写，业务侧不再自行存 localStorage
tokenConfig:
  refresh: false
  autoRefresh: false

# 布局与菜单：本应用不使用框架布局
layoutConfig:
  enable: false
  source: local

# Socket / 异常监控关闭（AI 控制台无对应后端通道）
socketConfig:
  enable: false

monitorConfig:
  enable: false

# 业务开关（app.yaml other.capabilities）
# AI 后端（spring-support-ai-starter → 8787）已引入 spring-support-datasearch-starter，
# 直接提供 /v2/weather/overview、/v2/location/resolve、/v2/typhoon/active|detail，
# 且返回结构与前端契约逐字段对齐，故这三项保持开启（前端探测命中即走后台，不再回落三方）。
# ipLookup 关闭：/v2/ip/lookup 由 api 业务层的 SysIpController 提供，8787 未引入，探测必然落空。
other:
  capabilities:
    weather: true
    location: true
    typhoon: true
    ipLookup: false
