<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具调用行交互验证夹具（配合 tool-row-probe.cjs，非应用入口）</title>
  <!--
    用途：本环境未安装任何工具插件（/v2/plugins/tool-displays 为空）、库内会话也没有
    工具调用记录，真机聊天页造不出工具行。此页在**私有 dev server** 上挂载真实的
    MessageToolCalls 组件 + 夹具数据，供 tool-row-probe.cjs 断言行交互状态机：
      默认工具图标 → 悬停「>」→ 点击「v」展开参数/结果（行尾「详情」仍开原弹窗）。
    运行：node node_modules/vite/bin/vite.js --port 15692 --strictPort
          BASE=http://localhost:15692 node src/acceptance/tool-row-probe.cjs
    说明：本文件不是应用入口，不会进入 dist 产物。
  -->
</head>

<body>
  <div id="app" style="padding: 24px; max-width: 760px;"></div>
  <script type="module">
    import { createApp, h } from 'vue'
    import { i18n } from '/src/locales/index.ts'
    import { setPluginToolDisplays } from '/src/utils/toolDisplay.ts'
    import MessageToolCalls from '/src/components/chat/message-item/MessageToolCalls.vue'

    // 与真实插件注册表同构：工具名 → 图标标识 + 文案（对齐截图里的 Read File / Search Files / Shell Command）
    setPluginToolDisplays({
      read: { icon: 'read', text: { executing: 'Read File', completed: 'Read File' } },
      search: { icon: 'search', text: { executing: 'Search Files', completed: 'Search Files' } },
      terminal: { icon: 'terminal', text: { executing: 'Shell Command', completed: 'Shell Command' } },
    })

    const toolCalls = [
      { name: 'read', outcome: 'success', arguments: JSON.stringify({ path: 'vue-support-parent-starter/packages/ui/src/components/ReRelationGraph/internals/G6Graph.vue' }) },
      { name: 'search', outcome: 'success', arguments: JSON.stringify({ pattern: 'minimap|小地图|act-minimap|toggleMinimap' }) },
      { name: 'terminal', outcome: 'success', arguments: JSON.stringify({ command: 'cd D:\\ch\\project\\vue-support-parent-starter; $env:E2E_LOGI=1' }) },
    ]
    const toolResponses = [
      JSON.stringify({ content: { path: 'G6Graph.vue', lines: 1024, note: 'fixture read result' } }),
      JSON.stringify({ content: [{ file: 'G6Graph.vue', line: 88, text: 'toggleMinimap()' }] }),
      JSON.stringify({ content: 'E2E log enabled (fixture)' }),
    ]

    const app = createApp({
      render: () => h(MessageToolCalls, {
        toolCalls,
        toolResponses,
        isStreaming: false,
        // contentId 缺省 → 不走懒加载，直接用上面的 props 数据（夹具自足）
      }),
    })
    app.use(i18n)
    app.mount('#app')
  </script>
</body>

</html>
