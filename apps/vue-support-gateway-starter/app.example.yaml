# ===========================================
# vue-support-gateway-starter 应用配置
# 网关中心：网关管理 / 远程控制
# ===========================================

# 路由配置（简化模式：仅暴露 gateway/remote 两个菜单，无登录）
routeConfig:
  mode: static
  remoteUrl: ""
  mergeLocalMenu: false
  modulePaths: []
  allowPrefixes: []
  whiteList:
    - /gateway
    - /remote
    - /403
    - /404
    - /500
  loginPath: /login
  homePath: /gateway
  notFoundPath: /404
  forbiddenPath: /403
  serverErrorPath: /500

# 系统信息
appConfig:
  title: Vue Support Gateway
  version: "1.0.0"
  systemCode: gateway
  openAuth: false

# 请求配置
httpConfig:
  baseUrl: "/gateway/api"
  apiVersion: ""
  enable: true
  encrypt: false
  timeout: 30000
  retryCount: 3
  retryDelay: 1000
  showLoading: true

# 缓存与存储配置
storageConfig:
  encode: true
  key: "GATEWAY2XNN4K8LC0ELVWN4"
  prefix: "gateway-"
  noPrefixKeys:
    - token
    - userInfo

# 令牌配置
tokenConfig:
  autoRefresh: true
  accessTokenKey: "accessToken"
  refreshTokenKey: "refreshToken"
  refreshUrl: "/gateway/api/v2/user/refresh-token"
  refreshInterval: 300000
  advanceRefresh: 60000

# 国际化配置
i18nConfig:
  defaultLocale: zh-CN
  locales:
    - zh-CN
    - en-US

# 上传配置
uploadConfig:
  url: ""
  maxSize: 10485760
  accept:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
    - ".zip"

# 环境配置
envConfig:
  env: dev

# 系统配置
systemConfig:
  showMessage: true
  showConfig: true
  showLog: true
  showMonitor: false

# Socket 连接配置（远程会话走 WebSocket）
socketConfig:
  enable: true
  protocol: websocket
  urls: ""
  context: "/socket.io"
  path: "/ws"
  autoConnect: false
  reconnection: true
  reconnectionAttempts: 5
  reconnectionDelay: 2000
  heartbeatInterval: 30000
  transports:
    - websocket

# 其它配置
other:
  themeId: "default"
