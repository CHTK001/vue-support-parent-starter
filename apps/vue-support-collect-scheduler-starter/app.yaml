# ===========================================
# 应用配置（vue-support-collect-scheduler-starter）
# 采集调度一体化平台：可视化流程编排 / 定时调度 / 任务监控 / 结果落库
#
# 结构：一个采集调度系统 app，依赖两个平级 pages 模块——@pages/collect（采集）与 @pages/job（调度）
# 后端：spring-api-support-collect-scheduler-starter（采集调度系统，18190，context-path /collect/api）
#       采集能力来自 spring-support-collect-starter（parent reactor），调度能力来自 spring-support-job-starter
# 鉴权：完全复用框架 oauth 体系——后端是 oauth-client 的 AuthFilter + static 协议，
#       登录接口是 common-system 内嵌的 /v2/user/login（校验 sys_user 并自签 SM4 令牌），
#       前端登录页、令牌守卫、过期跳转都走框架自带能力，本应用不自带登录界面。
# dev 走 vite 代理（见 vite.config.ts 三路路由）：
#   /collect/api/v2/scheduler -> COLLECT_SCHEDULER_TARGET，缺省 http://192.168.50.198:18191（调度）
#   /collect/api/ms           -> COLLECT_HUB_TARGET，缺省 http://192.168.50.198:8081（datasource-hub，
#                                rewrite 剥 /collect/api 前缀；18190 内嵌 hub 是旧构建，无 Manage 端点）
#   /collect/api              -> COLLECT_API_TARGET，缺省 http://192.168.50.198:18190（采集业务 + 登录）
# ===========================================

# 远程配置中心（/v2/setting/default 属 system 服务，采集后端未实现）关闭拉取
configConfig:
  enable: false

# 系统信息
appConfig:
  title: 采集调度一体化平台
  openAuth: true

# 登录/登出/当前用户全部指向框架 oauth 体系在采集后端内嵌的 common-system 登录接口
# （相对 httpConfig.baseUrl）。菜单走静态路由，不发菜单请求。
urlConfig:
  login: "/v2/user/login"
  logout: "/v2/user/logout"
  me: "/v2/user/me"

# 路由：静态路由（路由树即菜单树，由 .routes() 注入）
# homePath 指向本应用的总览页；它已在菜单树里，框架就不再注入「主控台/工作台」分组
routeConfig:
  mode: static
  homePath: /collect/dashboard

# API 基础路径：采集模块接口统一挂在 /collect/api 下
httpConfig:
  baseUrl: "/collect/api"
  moduleBaseUrl:
    collect: "/collect/api"
  # 令牌过期（401）时弹「重新登录」确认框，确认后跳框架登录页
  authFailAction: confirm

# 登录页配置（框架登录页）：采集控制台不用验证码/动态口令/滑块
loginConfig:
  captcha: false
  otp: false
  slider: false
  brandName: 采集调度一体化平台
  title: 采集调度一体化平台
  description: 可视化流程编排 · 定时调度 · 结果落库
  beiAnHao: ""

# 其他配置
other:
  themeId: "koi"
  toolbar:
    searchMenu: false
    refresh: true
    dark: true
    language: false
    fullScreen: true
    themeSetting: true
    user: true
    breadcrumb: true
    breadcrumbDropdown: true
    breadcrumbIcon: false
    tabIcon: true
    logo: true
    message: false
    # 平台公告接口属 system 服务，采集后端未实现（403 会被判为会话失效并跳登录）
    announcement: false
    weather: false
    # 台风组件走外部实时台风数据，采集控制台用不到；且无数据时 popover reference 为空会触发 ElOnlyChild 告警
    typhoon: false
    collapse: false
  weather:
    enable: false

# 布局配置
layoutConfig:
  enable: true
  source: local

# 菜单配置
menuConfig:
  collapseSingleChild: false
