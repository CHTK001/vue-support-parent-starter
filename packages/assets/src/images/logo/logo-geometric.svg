<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- 几何抽象 Logo - 三角形组合 -->
  <defs>
    <linearGradient id="grad-geo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  
  <!-- 外框圆形 -->
  <circle cx="64" cy="64" r="60" fill="url(#grad-geo)"/>
  
  <!-- 内部几何图形 -->
  <polygon points="64,28 92,72 36,72" fill="white" opacity="0.9"/>
  <polygon points="64,48 80,72 48,72" fill="url(#grad-geo)" opacity="0.8"/>
  
  <!-- 底部横线 -->
  <rect x="36" y="76" width="56" height="4" rx="2" fill="white" opacity="0.6"/>
  <rect x="44" y="84" width="40" height="4" rx="2" fill="white" opacity="0.4"/>
</svg>
