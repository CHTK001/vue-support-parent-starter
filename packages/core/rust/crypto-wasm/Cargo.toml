[package]
name = "crypto-wasm"
version = "0.1.0"
edition = "2021"
description = "core 的加密 wasm 模块（aes / sm2 / sm3 / sm4），供 loadCrypto 动态加载"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

# 国密算法（后续实现时启用）
# sm3 = "0.4"
# sm4 = "0.2"
# sm2 = "0.5"
# 对称加密（AES）
# aes = "0.8"
# cbc 模式
# cbc = "0.1"

[profile.release]
opt-level = "s"
